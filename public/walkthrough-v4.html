  if (!next.subtitle) {
    if (subEl) {
      subEl.style.transition = 'opacity 0.2s ease';
      subEl.style.opacity = '0';
      setTimeout(() => { if (subEl) subEl.innerHTML = ''; subEl.style.opacity = '1'; }, 220);
    }
  } else if (!subEl) {
    subEl = document.createElement('p');
    subEl.className = 'slide-sub s955-fadein';
    subEl.style.cssText = 'margin:0 0 14px; font-size:15px; max-width:820px; min-height:68px';
    heading.parentNode.insertBefore(subEl, heading.nextSibling);
    subEl.innerHTML = next.subtitle;
  } else {
    const prevSub = prev.subtitle || '';
    const nextSub = next.subtitle;
    if (prevSub === nextSub) {
      // No change: make sure DOM matches the canonical text.
      if (subEl.innerHTML !== nextSub) subEl.innerHTML = nextSub;
    } else if (nextSub.startsWith(prevSub) && prevSub.length > 0) {
      // Additive: keep the shared prefix on screen, fade in only the suffix.
      // Normalize DOM to the clean prev text, then append a faded-in span.
      subEl.innerHTML = prevSub;
      const suffix = nextSub.slice(prevSub.length);
      const span = document.createElement('span');
      span.innerHTML = suffix;
      span.style.opacity = '0';
      span.style.transition = 'opacity 0.35s ease';
      subEl.appendChild(span);
      requestAnimationFrame(() => { span.style.opacity = '1'; });
    } else if (prevSub.startsWith(nextSub) && nextSub.length > 0) {
      // Subtractive: the tail is going away. Wrap the part to remove in a
      // span, fade it out, then normalize DOM to the clean next text.
      const suffix = prevSub.slice(nextSub.length);
      subEl.innerHTML = nextSub + '<span class="__s955-dying">' + suffix + '</span>';
      const dying = subEl.querySelector('.__s955-dying');
      if (dying) {
        dying.style.transition = 'opacity 0.25s ease';
        requestAnimationFrame(() => { dying.style.opacity = '0'; });
        setTimeout(() => { if (subEl) subEl.innerHTML = nextSub; }, 280);
      } else {
        subEl.innerHTML = nextSub;
      }
    } else {
      // No shared prefix: fall back to a full fade swap.
      fadeSwapHTML(subEl, nextSub);
    }
  }

  // --- Team outlines / numbers / chips --- //
  const cards = slide.querySelectorAll('.s955-card');
  const teamIds = ['T1', 'T2', 'T3'];
  const effTeam = (phase, tid) => phaseTeam(phase, tid);
  teamIds.forEach((tid, idx) => {
    const card = cards[idx];
    if (!card) return;

    const prevT = effTeam(prev, tid);
    const nextT = effTeam(next, tid);

    // outline
    const shouldWin = next.highlights.includes(tid);
    card.classList.toggle('dyn-winner', shouldWin);
    card.classList.toggle('dyn-disagree', shouldWin && !!next.disagree);
    card.classList.toggle('dyn-staffing', shouldWin && !!next.staffing);

    // strength tween + provider list swap (when team composition changes)
    const strengthEl = card.querySelector('.dv-strength');
    if (strengthEl && prevT.strength !== nextT.strength) {
      const start = performance.now();
      const dur = 700;
      const from = prevT.strength, to = nextT.strength;
      const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
      const tick = (now) => {
        const t = Math.min(1, (now - start) / dur);
        const v = from + (to - from) * easeOutCubic(t);
        strengthEl.textContent = v.toFixed(1);
        if (t < 1) requestAnimationFrame(tick);
        else strengthEl.textContent = to.toFixed(1);
      };
      requestAnimationFrame(tick);
    }
    const miniCard = card.querySelector('.dv-mini-card');
    const highlightPgy1 = !!next.staffing && tid === 'T1';
    if (miniCard && JSON.stringify(prevT.providers) !== JSON.stringify(nextT.providers)) {
      const newHTML = '<ul>' + nextT.providers.map(([r, w]) => {
        const liCls = highlightPgy1 && /pgy-?1 intern/i.test(r) ? ' class="pgy1-highlight"' : '';
        return `<li${liCls}><span>${r}</span><span class="w">${w}</span></li>`;
      }).join('') + '</ul>';
      miniCard.style.transition = 'opacity 0.22s ease';
      miniCard.style.opacity = '0';
      setTimeout(() => { miniCard.innerHTML = newHTML; miniCard.style.opacity = '1'; }, 220);
    } else if (miniCard) {
      miniCard.querySelectorAll('li').forEach(li => {
        const roleEl = li.querySelector('span');
        const isPgy1 = roleEl && /pgy-?1 intern/i.test(roleEl.textContent);
        li.classList.toggle('pgy1-highlight', highlightPgy1 && isPgy1);
      });
    }

    // load + capacity numbers
    const chips = phaseChips(next, tid);
    const load = chips.reduce((s, c) => s + c.w, 0);
    const capacity = WK.formatRatio(WK.ratio(nextT.strength, load));
    const loadEl = card.querySelector('.dv-den');
    const capEl = card.querySelector('.dv-cap');
    const newLoad = load.toFixed(1);
    if (loadEl && loadEl.textContent !== newLoad) {
      loadEl.classList.remove('s955-fadein'); void loadEl.offsetWidth;
      loadEl.textContent = newLoad; loadEl.classList.add('s955-fadein');
    }
    if (capEl && capEl.textContent !== capacity) {
      // If transitioning between two finite numeric values, tween the
      // number upward/downward rather than the fade-swap (nicer for the
      // "capacity climbing as load decays" beats). Fall back to fade-swap
      // when either side is non-numeric (e.g. "∞").
      const fromNum = parseFloat(capEl.textContent);
      const toNum = parseFloat(capacity);
      const bothFinite = isFinite(fromNum) && isFinite(toNum)
                      && /^-?[0-9.]+$/.test(capEl.textContent.trim())
                      && /^-?[0-9.]+$/.test(String(capacity).trim());
      if (bothFinite) {
        const start = performance.now();
        const dur = 700;
        const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
        const tick = (now) => {
          const t = Math.min(1, (now - start) / dur);
          const v = fromNum + (toNum - fromNum) * easeOutCubic(t);
          capEl.textContent = v.toFixed(1);
          if (t < 1) requestAnimationFrame(tick);
          else capEl.textContent = capacity; // snap to canonical format
        };
        requestAnimationFrame(tick);
      } else {
        capEl.classList.remove('s955-fadein'); void capEl.offsetWidth;
        capEl.textContent = capacity; capEl.classList.add('s955-fadein');
      }
    }

    // chips reconciliation
    const container = card.querySelector('.dv-mini-patients');
    if (!container) return;
    const existing = [...container.querySelectorAll('.dv-mp')];
    // Extend chips with placeholder tone/w parsed from DOM.
    const existingData = existing.map(el => ({
      el,
      tone: [...el.classList].find(c => ['red','yellow','purple'].includes(c)) || '',
      w: parseFloat(el.textContent),
    }));

    // Align by tone, in order. Simple diff: pair up same-tone chips by index.
    const nextByTone = {};
    chips.forEach(c => { (nextByTone[c.tone] ||= []).push(c); });
    const oldByTone = {};
    existingData.forEach(d => { (oldByTone[d.tone] ||= []).push(d); });

    // Remove old chips that don't have a match.
    Object.keys(oldByTone).forEach(tone => {
      const remaining = (nextByTone[tone] || []).length;
      const extra = oldByTone[tone].slice(remaining);
      extra.forEach(d => {
        d.el.style.transition = 'opacity 0.25s ease, transform 0.25s ease';
        d.el.style.opacity = '0';
        d.el.style.transform = 'scale(0.5)';
        setTimeout(() => d.el.remove(), 260);
      });
    });

    // For each new chip, either update existing (same tone, same index) or add.
    Object.keys(nextByTone).forEach(tone => {
      const news = nextByTone[tone];
      const olds = oldByTone[tone] || [];
      news.forEach((c, i) => {
        const scale = 18;
        const targetWidth = (c.w * scale) + 'px';
        const targetLabel = c.w.toFixed(1);
        if (olds[i]) {
          const d = olds[i];
          d.el.style.transition = 'width 0.5s ease';
          d.el.style.width = targetWidth;
          if (d.el.textContent !== targetLabel) {
            d.el.classList.remove('s955-fadein'); void d.el.offsetWidth;
            d.el.textContent = targetLabel;
            d.el.classList.add('s955-fadein');
          }
        } else {
          // Add a new chip.
          const chip = document.createElement('div');
          chip.className = 'dv-mp ' + tone + ' just-arrived';
          chip.style.width = targetWidth;
          chip.textContent = targetLabel;
          container.appendChild(chip);
        }
      });
    });
  });

  // --- Chart --- //
  if (chartHost) {
    // No SVG swap. The chart is rendered once with full-domain paths; we
    // animate stroke-dashoffset to reveal/retract along the line, and fade
    // patient dots in/out at the right moments.
    setupWalkthroughChart(chartHost, newPhase, { animate: true, prevPhase });
  }

  return true;
}

function startDynamicCapacity() {
  const container = document.querySelector('.dyn-slide');
  if (!container) return () => {};

  // Compressed decay times (real seconds): one second stands for 30 minutes.
  const DECAY = { red: WK.ACUITY.Red.minutes / 30, yellow: WK.ACUITY.Yellow.minutes / 30, purple: WK.ACUITY.Purple.minutes / 30 };
  const W8 = { red: WK.ACUITY.Red.w, yellow: WK.ACUITY.Yellow.w, purple: WK.ACUITY.Purple.w };
  const P_SCALE = 20; // px per weight unit

  const teams = [
    { id: 'T1', strength: introStrength('T1'), patients: [
      { acuity: 'red',    weight: W8.red,    arrivedAt: 0 },
      { acuity: 'purple', weight: W8.purple, arrivedAt: 0 },
    ]},
    { id: 'T2', strength: introStrength('T2'), patients: [
      { acuity: 'yellow', weight: W8.yellow, arrivedAt: 0 },
      { acuity: 'yellow', weight: W8.yellow, arrivedAt: 0 },
    ]},
    { id: 'T3', strength: introStrength('T3'), patients: [
      { acuity: 'yellow', weight: W8.yellow, arrivedAt: 0 },
    ]},
  ];

  // Scheduled arrivals (simulation seconds)
  const arrivals = [
    { at: 2.0, acuity: 'yellow', weight: W8.yellow },
    { at: 4.5, acuity: 'red',    weight: W8.red },
    { at: 6.2, acuity: 'yellow', weight: W8.yellow },
    { at: 7.4, acuity: 'purple', weight: W8.purple },
  ];

  const ACUITY_COLORS = { red: '#c0392b', yellow: '#b8a000', purple: '#7b1fa2' };
  const ACUITY_NAMES  = { red: 'Red',     yellow: 'Yellow',  purple: 'Purple'  };
  const TEAM_NAMES    = { T1: 'Team 1',   T2: 'Team 2',      T3: 'Team 3'      };

  let simTime = 0;
  let lastFrame = performance.now();
  let paused = false;
  let processed = 0;
  let currentWinnerId = null;
  let pendingArrival = null;
  let freshPatient = null;
  let freshTimer = null;
  let raf = null;
  let stopped = false;

  const currentWeight = (p, t) => {
    const age = t - p.arrivedAt;
    if (age < 0) return 0;
    const win = DECAY[p.acuity];
    if (age >= win) return 0;
    return p.weight * (1 - age / win);
  };
  const teamLoad = (team, t) => team.patients.reduce((s, p) => s + currentWeight(p, t), 0);

  function setOutline(teamId, on) {
    const card = container.querySelector(`[data-team-card="${teamId}"]`);
    if (card) card.classList.toggle('dyn-winner', on);
  }
  function showCaption(acuity, teamId) {
    const cap = container.querySelector('.dyn-caption');
    if (!cap) return;
    const a = ACUITY_NAMES[acuity];
    const t = TEAM_NAMES[teamId];
    cap.innerHTML = `A <span style="color:${ACUITY_COLORS[acuity]};font-weight:600">${a}</span> patient arrives &nbsp;→&nbsp; <strong>${t}</strong> has the most room<span class="dyn-next-hint">Press Next →</span>`;
    cap.classList.add('visible');
  }
  function hideCaption() {
    const cap = container.querySelector('.dyn-caption');
    if (cap) cap.classList.remove('visible');
  }

  function tick() {
    if (stopped) return;
    const now = performance.now();
    if (!paused) simTime += (now - lastFrame) / 1000;
    lastFrame = now;

    while (!paused && processed < arrivals.length && arrivals[processed].at <= simTime) {
      const a = arrivals[processed];
      let best = null;
      for (const team of teams) {
        const l = teamLoad(team, simTime);
        const cap = l === 0 ? Infinity : team.strength / l;
        if (!best || cap > best.cap) best = { team, cap };
      }
      // Defer actual assignment until the user advances, so the paused view
      // shows the pre-arrival capacities that justified the choice.
      pendingArrival = { acuity: a.acuity, weight: a.weight, winnerId: best.team.id };
      currentWinnerId = best.team.id;
      setOutline(currentWinnerId, true);
      showCaption(a.acuity, currentWinnerId);
      paused = true;
      processed++;
    }

    for (const team of teams) {
      const l = teamLoad(team, simTime);
      const lRounded = Math.round(l * 10) / 10;
      const capFromShown = l === 0 ? Infinity : team.strength / l;
      const row = container.querySelector(`[data-team="${team.id}"]`);
      if (!row) continue;
      const loadEl = row.querySelector('.dyn-load');
      const capEl = row.querySelector('.dyn-cap');
      const patientsEl = row.querySelector('.dyn-patients');
      if (loadEl) loadEl.textContent = lRounded.toFixed(1);
      if (capEl) capEl.textContent = isFinite(capFromShown) ? capFromShown.toFixed(1) : '∞';
      if (patientsEl) {
        const active = team.patients
          .map(p => ({ p, w: currentWeight(p, simTime) }))
          .filter(x => x.w > 0.15);
        if (patientsEl.children.length !== active.length) {
          patientsEl.innerHTML = active.map(({ p, w }) => {
            const fresh = p === freshPatient ? ' just-arrived' : '';
            return `<div class="dv-mp ${p.acuity}${fresh}" style="width:${(w * P_SCALE).toFixed(1)}px">${w >= 0.8 ? w.toFixed(1) : ''}</div>`;
          }).join('');
        } else {
          [...patientsEl.children].forEach((el, i) => {
            const item = active[i];
            if (!item) return;
            el.style.width = (item.w * P_SCALE).toFixed(1) + 'px';
            el.textContent = item.w >= 0.8 ? item.w.toFixed(1) : '';
          });
        }
      }
    }

    raf = requestAnimationFrame(tick);
  }

  const nextHandler = () => {
    if (paused) {
      if (pendingArrival) {
        const winner = teams.find(t => t.id === pendingArrival.winnerId);
        if (winner) {
          const newPatient = {
            acuity: pendingArrival.acuity,
            weight: pendingArrival.weight,
            arrivedAt: simTime,
          };
          winner.patients.push(newPatient);
          freshPatient = newPatient;
          if (freshTimer) clearTimeout(freshTimer);
          freshTimer = setTimeout(() => { freshPatient = null; }, 700);
        }
        pendingArrival = null;
      }
      if (currentWinnerId) setOutline(currentWinnerId, false);
      currentWinnerId = null;
      hideCaption();
      paused = false;
      return true;
    }
    if (processed < arrivals.length) {
      // Fast-forward to the next arrival
      simTime = arrivals[processed].at;
      return true;
    }
    // Simulation done: release the handler so default advance fires
    slideNextHandler = null;
    return false;
  };
  slideNextHandler = nextHandler;

  raf = requestAnimationFrame(tick);

  return () => {
    stopped = true;
    if (slideNextHandler === nextHandler) slideNextHandler = null;
    if (raf) cancelAnimationFrame(raf);
    if (freshTimer) clearTimeout(freshTimer);
  };
}

function stepIntro(phase) {
  if (phase === 0) return slideIntro();
  if (phase === 1) return slideProblem1();
  if (phase === 2) return slideProblem2();
  if (phase === 3) return slideFormula();
  if (phase === 4) return slideStrength();
  if (phase === 5) return slideLoad();
  if (phase === 6) return slideCapacity();
  if (phase === 7) return slideDynamicCapacity();
  return slideIntro();
}

// Load-minutes from 09:55 to the last arrival (the area under the load line).
function teamAUC(team, strategy) {
  return Math.round(WK.loadMinutes(team, strategy === 'actual' ? 'actual' : 'formula'));
}

function loadMinDefinition() {
  const total = teamAUC('T1', 'actual') + teamAUC('T2', 'actual') + teamAUC('T3', 'actual');
  return `<strong>Load-minutes</strong> measure a team's total workload over the window: the area under its load curve.<br>
    One unit of acuity-weighted load sustained for one minute.<br>
    Same <strong>${total} load-minutes</strong>, only redistributed.`;
}

const HIST_PEAK = WK.worstPeak('actual');
const FORMULA_PEAK = WK.worstPeak('formula');
const FORMULA_COUNTS = WK.counts('formula');
const FORMULA_COMPARE_HEADINGS = {
  0: 'What the formula would have done.',
  1: `The worst peak drops from <span style="color:#c0392b">${HIST_PEAK.load.toFixed(1)}</span> to <span style="color:#2e7d32">${FORMULA_PEAK.load.toFixed(1)}</span>.`,
  2: '<span style="color:var(--t1)">Team 1\'s workload:</span> Historical vs. Formula.',
  3: '<span style="color:var(--t2)">Team 2\'s workload:</span> Historical vs. Formula.',
  4: '<span style="color:var(--t3)">Team 3\'s workload:</span> Historical vs. Formula.',
};
const FORMULA_COMPARE_SUBS = {
  0: `Same ${WK.ARRIVALS.length} patients, same ${WK.WINDOW} minutes, routed by <span style="color:#2e7d32">capacity formula</span> from the very first patient.<br>
      <span style="display:inline-flex; align-items:center; gap:48px; margin-top:4px">
        <span><strong>Historical</strong>
          <span style="color:var(--t1)">&nbsp;●&nbsp;${HIST_COUNTS.T1}</span>
          <span style="color:var(--t2)">&nbsp;●&nbsp;${HIST_COUNTS.T2}</span>
          <span style="color:var(--t3)">&nbsp;●&nbsp;${HIST_COUNTS.T3}</span>
        </span>
        <span><strong>Formula</strong>
          <span style="color:var(--t1)">&nbsp;●&nbsp;${FORMULA_COUNTS.T1}</span>
          <span style="color:var(--t2)">&nbsp;●&nbsp;${FORMULA_COUNTS.T2}</span>
          <span style="color:var(--t3)">&nbsp;●&nbsp;${FORMULA_COUNTS.T3}</span>
        </span>
      </span>`,
  1: `Historical routing lets ${teamName(HIST_PEAK.team)}'s load spike to <strong style="color:#c0392b">${HIST_PEAK.load.toFixed(1)}</strong> at ${WK.clock(HIST_PEAK.t)}.<br>
      Formula routing keeps every team at or below ${FORMULA_PEAK.load.toFixed(1)} for the full ${WK.WINDOW}-minute window.`,
  2: loadMinDefinition(),
  3: loadMinDefinition(),
  4: loadMinDefinition(),
};
const FORMULA_COMPARE_FOCUS = { 2: 'T1', 3: 'T2', 4: 'T3' };

function stepFormulaCompare(phase = 0) {
  const legend = `
    <div class="chart-legend" style="display:flex;gap:14px;justify-content:center;margin-top:4px;font-size:11px;color:var(--muted);flex-wrap:wrap">
      <span><span style="display:inline-block;width:14px;height:2px;background:var(--t1);vertical-align:middle;margin-right:4px"></span>Team 1</span>
      <span><span style="display:inline-block;width:14px;height:2px;background:var(--t2);vertical-align:middle;margin-right:4px"></span>Team 2</span>
      <span><span style="display:inline-block;width:14px;height:2px;background:var(--t3);vertical-align:middle;margin-right:4px"></span>Team 3</span>
      <span style="color:#c0392b">● Red (+4)</span>
      <span style="color:#b8a000">● Yellow (+2)</span>
      <span style="color:#7b1fa2">● Purple (+1)</span>
    </div>`;
  const chartTitle = (color, label) =>
    `<div class="chart-title" style="font-size:13px;font-weight:600;text-align:center;margin-bottom:6px;color:${color}">${label}</div>`;

  const threshold = FORMULA_PEAK.load;
  const slideClasses = ['compare-slide'];
  if (phase === 1) slideClasses.push('slide-shades');
  if (FORMULA_COMPARE_FOCUS[phase]) slideClasses.push('focus-' + FORMULA_COMPARE_FOCUS[phase]);

  const histAUC = { T1: teamAUC('T1', 'actual'), T2: teamAUC('T2', 'actual'), T3: teamAUC('T3', 'actual') };
  const formAUC = { T1: teamAUC('T1', 'formula-replay'), T2: teamAUC('T2', 'formula-replay'), T3: teamAUC('T3', 'formula-replay') };

  return `
    <div class="slide ${slideClasses.join(' ')}">
      <div class="problem-eyebrow" style="color:#1a3a7b;margin-bottom:6px">COMPARISON</div>
      <h1 class="slide-title serif compare-heading" style="margin:0 0 6px; font-size:30px; color:#000">${FORMULA_COMPARE_HEADINGS[phase] || FORMULA_COMPARE_HEADINGS[0]}</h1>
      <p class="slide-sub compare-sub" style="margin:0 0 18px; font-size:15px; max-width:820px; min-height:68px">${FORMULA_COMPARE_SUBS[phase] || FORMULA_COMPARE_SUBS[0]}</p>
      <div class="compare-charts" style="display:flex; gap:20px; align-items:flex-start">
        <div class="chart-wrap" style="flex:1 1 0; padding:10px 14px 6px">
          ${chartTitle('var(--muted)', 'Historical routing')}
          ${renderChart({
            patientsShown: 8, currentPatient: null, strategy: 'actual',
            width: 560, height: 340, xStart: -5,
            hideLegend: true, strokeOnly: true, fullDomain: true,
            areasControlled: true,
            aucLabels: histAUC,
            capShade: { threshold, fill: 'rgba(192, 57, 43, 0.14)', stroke: '#c0392b' },
          })}
          ${legend}
        </div>
        <div class="chart-wrap formula-chart-wrap" style="flex:1 1 0; padding:10px 14px 6px">
          ${chartTitle('#2e7d32', 'What formula recommended')}
          ${renderChart({
            patientsShown: 8, currentPatient: null, strategy: 'formula-replay',
            width: 560, height: 340, xStart: -5,
            hideLegend: true, strokeOnly: true, fullDomain: true,
            areasControlled: true,
            aucLabels: formAUC,
            capShade: { threshold, fill: 'rgba(46, 125, 50, 0.12)', stroke: '#2e7d32' },
          })}
          ${legend}
        </div>
      </div>
    </div>
  `;
}

function updateFormulaCompare(prevPhase, nextPhase) {
  const slide = main.querySelector('.compare-slide');
  if (!slide) return false;
  slide.classList.toggle('slide-shades', nextPhase === 1);
  ['T1', 'T2', 'T3'].forEach(tid => slide.classList.remove('focus-' + tid));
  const focus = FORMULA_COMPARE_FOCUS[nextPhase];
  if (focus) {
    // The intro animation leaves inline opacity on dots/labels which would
    // outrank the focus-T{N} CSS rule: strip it so CSS can dim them.
    slide.querySelectorAll('.patient-dot, .patient-dot-label').forEach(el => {
      el.style.removeProperty('opacity');
    });
    slide.classList.add('focus-' + focus);
  }
  const heading = slide.querySelector('.compare-heading');
  const sub = slide.querySelector('.compare-sub');
  if (heading) heading.innerHTML = FORMULA_COMPARE_HEADINGS[nextPhase] || FORMULA_COMPARE_HEADINGS[0];
  if (sub) sub.innerHTML = FORMULA_COMPARE_SUBS[nextPhase] || FORMULA_COMPARE_SUBS[0];
  return true;
}

function animateFormulaReveal(wrap, durationMs = 4500) {
  if (!wrap) return () => {};
  const svg = wrap.querySelector('svg.chart');
  if (!svg) return () => {};

  const paths = [...svg.querySelectorAll('path[data-team]')];
  const dots = [...svg.querySelectorAll('.patient-dot')];
  const labels = [...svg.querySelectorAll('.patient-dot-label')];
  const noonMarker = svg.querySelector('.noon-marker');
  const noonLabel = svg.querySelector('.noon-label');

  paths.forEach(p => {
    const total = p.getTotalLength();
    if (!isFinite(total) || total <= 0) return;
    p.style.transition = 'none';
    p.style.strokeDasharray = total + 'px';
    p.style.strokeDashoffset = total + 'px';
  });
  [...dots, ...labels].forEach(el => { el.style.opacity = '0'; el.style.transition = 'none'; });
  if (noonMarker) { noonMarker.style.opacity = '0'; noonMarker.style.transition = 'none'; }
  if (noonLabel)  { noonLabel.style.opacity  = '0'; noonLabel.style.transition  = 'none'; }

  void svg.getBoundingClientRect();

  paths.forEach(p => {
    p.style.transition = `stroke-dashoffset ${durationMs}ms linear`;
    p.style.strokeDashoffset = '0px';
  });

  const timeouts = [];
  const schedule = (el, delay) => {
    if (!el) return;
    const t = setTimeout(() => {
      el.style.transition = 'opacity 250ms ease';
      el.style.opacity = '1';
    }, Math.max(0, delay));
    timeouts.push(t);
  };

  PATIENTS.forEach((p, i) => {
    const delay = (p.t / CHART_MAX) * durationMs;
    schedule(dots[i], delay);
    schedule(labels[i], delay);
  });
  // Noon marker at t=125
  const noonDelay = (125 / CHART_MAX) * durationMs;
  schedule(noonMarker, noonDelay);
  schedule(noonLabel, noonDelay);

  return () => timeouts.forEach(clearTimeout);
}

// Header title for each phase of the walkthrough, from the phase itself.
const S955_TITLES = S955_PHASES.map(ph => {
  if (ph.staffing) return `${WK.clock(WK.NOON)}: intern joins Team 1`;
  if (!ph.kind) return `${WK.clock(0)}: all teams empty`;
  return `${WK.clock(WK.ARRIVALS[ph.n - 1].t)}: patient ${ph.n} ${ph.kind === 'place' ? 'placed' : 'arrives'}`;
});

const STEPS = [
  { section: 'Intro',       title: 'What\'s wrong with round robin?', render: stepIntro, phases: 8,
    phaseTitles: ['What\'s wrong with round robin?', 'All teams are not equal', 'All patients are not equal', 'One formula', 'Strength', 'Load', 'Divide', 'Decide'] },
  { section: 'Walkthrough', title: 'A real-life example', render: stepNYUBK },
  { section: 'Walkthrough', title: 'The morning', render: stepStart955, phases: 18, update: updateStart955, phaseTitles: S955_TITLES },
  { section: 'Comparison',  title: 'Formula comparison', render: stepFormulaCompare, phases: 5, update: updateFormulaCompare,
    phaseTitles: ['What the formula would have done', 'The worst peak', 'Team 1 workload', 'Team 2 workload', 'Team 3 workload'] },
];
const stepTitle = (s, p) => (s.phaseTitles && s.phaseTitles[p]) || s.title;

// ============================================================
// ROUTING / STATE
// ============================================================
let current = 0;
let phase = 0;
let cleanupActiveSlide = null;
let slideNextHandler = null;
const main = document.getElementById('main');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const counter = document.getElementById('counter');
const stepTitleEl = document.getElementById('stepTitle');
const progressEl = document.getElementById('progress');

let prevPhase = null;
let prevCurrent = null;
function render() {
  if (cleanupActiveSlide) { cleanupActiveSlide(); cleanupActiveSlide = null; }
  const step = STEPS[current];
  const phases = step.phases || 1;
  const canUpdate = step.update && prevCurrent === current && prevPhase != null
                 && step.update(prevPhase, phase);
  if (!canUpdate) {
    main.innerHTML = `<div class="step active">${step.render(phase)}</div>`;
    // Post-render hooks for steps that use persistent-SVG transitions.
    const s955slide = main.querySelector('.s955-slide');
    if (s955slide) {
      setupWalkthroughChart(s955slide.querySelector('.chart-wrap'), phase, { animate: false });
    }
    if (current === 3) {
      const wraps = main.querySelectorAll('.chart-wrap');
      const histWrap = wraps[0];
      if (histWrap) {
        const nm = histWrap.querySelector('.noon-marker');
        const nl = histWrap.querySelector('.noon-label');
        if (nm) nm.style.opacity = '1';
        if (nl) nl.style.opacity = '1';
      }
      const formulaWrap = main.querySelector('.formula-chart-wrap');
      if (phase === 0) {
        cleanupActiveSlide = animateFormulaReveal(formulaWrap);
      } else {
        // Cold-start on phase >= 1: skip animation, just reveal the formula chart.
        const svg = formulaWrap && formulaWrap.querySelector('svg.chart');
        if (svg) {
          svg.querySelectorAll('.noon-marker, .noon-label').forEach(el => el.style.opacity = '1');
        }
      }
    }
  }
  prevCurrent = current;
  prevPhase = phase;

  // Global slide index: count every phase as its own slide.
  const totalSlides = STEPS.reduce((a, s) => a + (s.phases || 1), 0);
  let slideBefore = 0;
  for (let i = 0; i < current; i++) slideBefore += (STEPS[i].phases || 1);
  const globalSlide = slideBefore + phase + 1;

  counter.textContent = `Slide ${globalSlide} of ${totalSlides}`;
  stepTitleEl.textContent = `Slide ${globalSlide} · ${stepTitle(step, phase)}`;
  prevBtn.disabled = current === 0 && phase === 0;
  nextBtn.disabled = current === STEPS.length - 1 && phase === phases - 1;

  // Group consecutive steps by section label so multiple steps can fold
  // under one chip (e.g. Brooklyn intro + Walkthrough share "Walkthrough").
  const sections = [];
  STEPS.forEach((s, stepIdx) => {
    const label = s.section || s.title;
    const last = sections[sections.length - 1];
    if (last && last.label === label) last.stepIndices.push(stepIdx);
    else sections.push({ label, stepIndices: [stepIdx] });
  });

  const chips = sections.map(sec => {
    const isCurrent = sec.stepIndices.includes(current);
    const isDone = sec.stepIndices[sec.stepIndices.length - 1] < current;
    const cls = `section-chip${isCurrent ? ' current' : ''}${isDone ? ' done' : ''}`;
    return `<div class="${cls}" data-first-step="${sec.stepIndices[0]}">${sec.label}</div>`;
  }).join('<span class="section-sep">·</span>');

  const currentSection = sections.find(sec => sec.stepIndices.includes(current));
  const phaseDots = [];
  currentSection.stepIndices.forEach(stepIdx => {
    const s = STEPS[stepIdx];
    const ph = s.phases || 1;
    for (let p = 0; p < ph; p++) {
      const isCurrentDot = stepIdx === current && p === phase;
      const isDoneDot = stepIdx < current || (stepIdx === current && p < phase);
      phaseDots.push(`<div class="dot ${isDoneDot ? 'done' : ''} ${isCurrentDot ? 'current' : ''}" data-step="${stepIdx}" data-phase="${p}" title="${stepTitle(s, p)}"></div>`);
    }
  });

  progressEl.innerHTML = `
    <div class="section-chips">${chips}</div>
    <div class="phase-dots">${phaseDots.join('')}</div>
  `;
  progressEl.querySelectorAll('.section-chip').forEach(c => c.addEventListener('click', () => {
    current = +c.dataset.firstStep;
    phase = 0;
    render();
  }));
  progressEl.querySelectorAll('.dot').forEach(d => d.addEventListener('click', () => {
    current = +d.dataset.step;
    phase = +d.dataset.phase;
    render();
  }));
  localStorage.setItem('walkthrough-step', current);
  localStorage.setItem('walkthrough-phase', phase);
  window.location.hash = `slide-${globalSlide}`;
  if (current === 0 && phase === 7) {
    cleanupActiveSlide = startDynamicCapacity();
  }
}

function go(i) {
  if (i < 0 || i >= STEPS.length) return;
  current = i;
  phase = 0;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function advance() {
  if (slideNextHandler) {
    const handled = slideNextHandler();
    if (handled !== false) return;
  }
  const phases = STEPS[current].phases || 1;
  if (phase < phases - 1) { phase++; render(); }
  else go(current + 1);
}
function retreat() {
  if (phase > 0) { phase--; render(); }
  else if (current > 0) {
    current--;
    const prevPhases = STEPS[current].phases || 1;
    phase = prevPhases - 1;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

prevBtn.addEventListener('click', retreat);
nextBtn.addEventListener('click', advance);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') advance();
  else if (e.key === 'ArrowLeft') retreat();
});

// dark-mode preference: query-param wins (set by parent app), then localStorage.
const urlParams = new URLSearchParams(window.location.search);
const queryDark = urlParams.get('dark');
const storedDark = localStorage.getItem('walkthrough-dark');
const initialDark = queryDark != null ? queryDark === '1' : storedDark === '1';
if (initialDark) document.body.classList.add('dark');
const modeToggle = document.getElementById('modeToggle');
const syncToggleIcon = () => { modeToggle.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙'; };
syncToggleIcon();
modeToggle.addEventListener('click', () => {
  const on = document.body.classList.toggle('dark');
  localStorage.setItem('walkthrough-dark', on ? '1' : '0');
  syncToggleIcon();
});

// restore state
const hashMatch = window.location.hash.match(/step-(\d+)/);
if (hashMatch) current = Math.max(0, Math.min(STEPS.length - 1, parseInt(hashMatch[1]) - 1));
else {
  const saved = parseInt(localStorage.getItem('walkthrough-step') || '0');
  if (!isNaN(saved)) current = Math.max(0, Math.min(STEPS.length - 1, saved));
  const savedPhase = parseInt(localStorage.getItem('walkthrough-phase') || '0');
  const maxPhase = (STEPS[current].phases || 1) - 1;
  if (!isNaN(savedPhase)) phase = Math.max(0, Math.min(maxPhase, savedPhase));
}
render();
</script>
