<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Capacity Conscious Triage: Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --ink: #1a1f2e;
    --muted: #5f6b7d;
    --border: #e5e7eb;
    --grid: #eef0f3;
    --t1: #1f8a8a; /* teal */
    --t2: #7b3fa0; /* purple */
    --t3: #4a5568; /* slate */
    --red: #d32f2f;
    --yellow: #fbc02d;
    --purple: #7b1fa2;
    --agree: #2e7d32;
    --disagree: #c0392b;
  }
  body.dark {
    --bg: #0f172a;
    --surface: #1e293b;
    --ink: #f1f5f9;
    --muted: #94a3b8;
    --border: #334155;
    --grid: #273449;
    --t3: #a5b4cc;
  }
  .mode-toggle {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    width: 34px; height: 34px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 15px;
    display: inline-flex; align-items: center; justify-content: center;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }
  .mode-toggle:hover { color: var(--ink); border-color: var(--muted); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    line-height: 1.5;
  }
  .serif { font-family: 'EB Garamond', Georgia, serif; }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .title-stack { display: flex; flex-direction: column; }
  .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
  .step-title { font-family: 'EB Garamond', serif; font-size: 20px; font-weight: 500; }
  .progress {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: center;
  }
  .section-chips {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }
  .section-chip {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 4px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .section-chip:hover { color: var(--ink); border-color: var(--muted); }
  .section-chip.done { color: var(--ink); border-color: var(--muted); }
  .section-chip.current {
    background: var(--t1);
    color: white;
    border-color: var(--t1);
  }
  .section-sep { color: var(--border); font-size: 10px; user-select: none; }
  .phase-dots {
    display: flex;
    gap: 6px;
    align-items: center;
    min-height: 12px;
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: transparent;
    cursor: pointer;
    transition: all 0.2s;
    flex: 0 0 auto;
  }
  .dot.done { background: var(--muted); border-color: var(--muted); }
  .dot.current { background: var(--t1); border-color: var(--t1); transform: scale(1.5); }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 24px 120px;
  }
  .step { display: none; }
  .step.active { display: block; animation: fade 0.3s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .hero-title {
    font-family: 'EB Garamond', serif;
    font-size: 44px;
    font-weight: 500;
    line-height: 1.1;
    margin: 32px 0 16px;
  }
  .lede {
    font-size: 18px;
    color: var(--muted);
    max-width: 640px;
    line-height: 1.55;
  }

  .chart-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin: 24px 0;
  }
  svg.chart { display: block; width: 100%; height: auto; }

  .teams-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin: 24px 0;
  }
  .team-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .team-card.t1 { border-top: 3px solid var(--t1); }
  .team-card.t2 { border-top: 3px solid var(--t2); }
  .team-card.t3 { border-top: 3px solid var(--t3); }
  .team-name { font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
  .team-stat-row { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; }
  .team-stat-row span:first-child { color: var(--muted); }
  .team-stat-row span:last-child { font-variant-numeric: tabular-nums; font-weight: 500; }

  .rules-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin: 24px 0; }
  .rule { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
  .rule h3 { margin: 0 0 8px; font-family: 'EB Garamond', serif; font-size: 22px; font-weight: 500; }
  .rule p { margin: 0; font-size: 14px; color: var(--muted); }

  .patient-header {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 16px;
  }
  .pnum { font-family: 'EB Garamond', serif; font-size: 32px; font-weight: 500; }
  .ptime { font-weight: 600; font-size: 15px; }
  .acuity-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .acuity-pill.red { background: rgba(211, 47, 47, 0.1); color: var(--red); }
  .acuity-pill.yellow { background: rgba(251, 192, 45, 0.15); color: #8a6400; }
  .acuity-pill.purple { background: rgba(123, 31, 162, 0.1); color: var(--purple); }
  .acuity-pill .dot-sm { width: 8px; height: 8px; border-radius: 50%; }
  .acuity-pill.red .dot-sm { background: var(--red); }
  .acuity-pill.yellow .dot-sm { background: var(--yellow); }
  .acuity-pill.purple .dot-sm { background: var(--purple); }
  .verdict { margin-left: auto; padding: 4px 12px; border-radius: 6px; font-weight: 700; font-size: 12px; letter-spacing: 0.05em; }
  .verdict.agree { background: rgba(46, 125, 50, 0.12); color: var(--agree); }
  .verdict.disagree { background: rgba(192, 57, 43, 0.12); color: var(--disagree); }

  .ratios {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 16px 0;
  }
  .ratio {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    text-align: center;
  }
  .ratio.rec { border: 2px solid var(--agree); background: rgba(46, 125, 50, 0.04); }
  .ratio .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .ratio .value { font-family: 'EB Garamond', serif; font-size: 34px; font-weight: 500; margin-top: 4px; line-height: 1; }
  .ratio .sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

  .narrative {
    background: var(--surface);
    border-left: 3px solid var(--t1);
    padding: 16px 20px;
    margin: 16px 0;
    border-radius: 4px;
    font-family: 'EB Garamond', serif;
    font-size: 18px;
    line-height: 1.55;
  }
  .decision {
    font-size: 13px;
    color: var(--muted);
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    font-family: 'Inter', sans-serif;
  }

  nav.controls {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
  }
  nav.controls button {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 10px 20px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    transition: all 0.15s;
  }
  nav.controls button:hover:not(:disabled) { background: var(--ink); color: white; border-color: var(--ink); }
  nav.controls button:disabled { opacity: 0.4; cursor: not-allowed; }
  nav.controls .step-counter { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  nav.controls .step-meta { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  nav.controls .copyright { font-size: 10px; color: var(--muted); letter-spacing: 0.02em; }

  .placeholder {
    background: var(--surface);
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 64px 24px;
    text-align: center;
    color: var(--muted);
  }
  /* Slide layout: fills viewport, no scroll */
  main { min-height: calc(100vh - 140px); display: flex; flex-direction: column; }
  .step { flex: 1; display: none; }
  .step.active { display: flex; flex-direction: column; }
  .slide { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; animation: fade 0.35s ease; position: relative; }
  .slide-title { font-family: 'EB Garamond', serif; font-weight: 500; font-size: 48px; line-height: 1.1; margin: 0 0 24px; max-width: 900px; }
  .slide-sub { font-size: 18px; color: var(--muted); max-width: 640px; margin: 0 0 20px; line-height: 1.5; }

  .problem-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--disagree);
    margin-bottom: 14px;
  }
  .problem-eyebrow::before,
  .problem-eyebrow::after {
    content: '';
    display: block;
    width: 40px;
    height: 1.5px;
    background: currentColor;
    opacity: 0.5;
  }

  /* Intro step */
  .intro-wrap { min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 20px; }
  .intro-q { font-family: 'EB Garamond', serif; font-size: 64px; font-weight: 500; line-height: 1.05; margin: 0 0 40px; max-width: 800px; }
  .intro-q .fade-in { opacity: 0; animation: fadeUp 0.7s ease forwards; }
  .intro-sub { font-size: 18px; color: var(--muted); max-width: 560px; margin: 0 auto 32px; line-height: 1.55; opacity: 0; animation: fadeUp 0.7s ease forwards; animation-delay: 0.15s; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .rr-diagram { position: relative; width: 480px; height: 380px; margin: 16px auto; }
  .rr-team {
    position: absolute;
    width: 150px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 12px 10px 10px;
    display: flex; flex-direction: column; align-items: center;
    font-family: 'EB Garamond', serif;
    font-size: 16px;
    font-weight: 500;
    color: var(--ink);
    z-index: 2;
    box-shadow: 0 2px 8px rgba(26, 31, 46, 0.04);
  }
  .rr-team.t1 { top: 0; left: 50%; transform: translateX(-50%); border-color: var(--t1); }
  .rr-team.t2 { bottom: 0; right: 0; border-color: var(--t2); }
  .rr-team.t3 { bottom: 0; left: 0; border-color: var(--t3); }
  .rr-team .docs { display: flex; align-items: flex-end; justify-content: center; gap: 2px; height: 66px; margin-bottom: 4px; }
  .rr-team svg.doc { display: block; }
  .rr-arrow-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; z-index: 1; pointer-events: none; }
  .rr-track {
    fill: none;
    stroke: var(--border);
    stroke-width: 2;
    stroke-linecap: round;
  }
  .rr-flow {
    fill: none;
    stroke: var(--ink);
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-dasharray: 14 10;
    stroke-opacity: 0.75;
    animation: rrDash 3.2s linear infinite;
  }
  .rr-arrowhead { fill: var(--ink); }
  @keyframes rrDash {
    to { stroke-dashoffset: -72; }
  }
  .rr-caption {
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    fill: var(--muted);
    text-anchor: middle;
    dominant-baseline: central;
  }
  .rr-caption-sub {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 15px;
    font-style: italic;
    fill: var(--muted);
    text-anchor: middle;
    dominant-baseline: central;
    opacity: 0.75;
  }

  .reveal-stack { max-width: 640px; margin: 32px auto 0; text-align: left; }
  .reveal-item {
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.6s ease, transform 0.6s ease;
    padding: 20px 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 14px;
    font-size: 16px;
    line-height: 1.55;
  }
  .reveal-item.show { opacity: 1; transform: translateY(0); }
  .reveal-item strong { font-family: 'EB Garamond', serif; font-size: 20px; font-weight: 500; display: block; margin-bottom: 6px; color: var(--ink); }
  .reveal-item.problem-1 strong { color: var(--disagree); }
  .reveal-item.problem-2 strong { color: var(--disagree); }

  /* Horizontal team row with inequality signs */
  .teams-row { display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap; }
  .teams-row .rr-team { position: static; transform: none; top: auto; left: auto; right: auto; bottom: auto; }
  .neq { font-family: 'EB Garamond', serif; font-size: 48px; color: var(--ink); font-weight: 500; }

  .patient-card {
    background: transparent;
    border: 1.5px solid var(--ink);
    border-radius: 12px;
    padding: 10px 16px;
    min-width: 170px;
    text-align: left;
  }
  .patient-card .pc-title {
    font-family: 'EB Garamond', serif;
    font-size: 18px;
    font-weight: 500;
    text-align: center;
    margin-bottom: 4px;
  }
  .patient-card ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.3; }
  .patient-card li { margin: 0; }
  .patient-card .pc-weight {
    margin: 8px -16px -10px; padding: 6px 14px;
    display: flex; align-items: baseline;
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 14px; font-weight: 600; color: #fff;
    border-radius: 0 0 10px 10px;
  }
  .patient-card .pc-weight .dots { flex: 1; border-bottom: 1px dotted rgba(255,255,255,0.4); margin: 0 6px; transform: translateY(-3px); }
  .patients-row { display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap; }

  .team-list-card {
    background: transparent;
    border: 1.5px solid var(--ink);
    border-radius: 12px;
    padding: 16px 24px;
    min-width: 160px;
    text-align: left;
  }
  .team-list-card.t1 { border-color: var(--t1); }
  .team-list-card.t2 { border-color: #d97706; }
  .team-list-card.t3 { border-color: var(--t3); }
  .team-list-card .tlc-title {
    font-family: 'EB Garamond', serif;
    font-size: 20px;
    font-weight: 500;
    text-align: center;
    margin-bottom: 10px;
    color: var(--ink);
  }
  .team-list-card ul { margin: 0; padding-left: 18px; font-size: 15px; font-weight: 600; line-height: 1.6; color: var(--ink); }
  .team-list-card li { margin: 2px 0; }
  .team-list-card ul.weighted { list-style: none; padding: 0; font-size: 13px; line-height: 1.3; }
  .team-list-card ul.weighted li { display: flex; align-items: baseline; font-weight: 500; margin: 0; }
  .team-list-card ul.weighted li .role { flex: 0 0 auto; }
  .team-list-card ul.weighted li .w { flex: 0 0 auto; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  .team-list-card .dots { flex: 1; border-bottom: 1px dotted var(--border); margin: 0 6px; transform: translateY(-3px); min-width: 12px; }
  .team-list-card .tlc-total {
    margin: 8px -16px -10px; padding: 8px 16px;
    display: flex; align-items: baseline; font-family: 'Inter', system-ui, sans-serif;
    font-size: 14px; font-weight: 600; color: #fff;
    border-radius: 0 0 10px 10px;
  }
  .team-list-card .tlc-total .total-val { font-variant-numeric: tabular-nums; color: #fff; }
  .team-list-card .tlc-total .dots { border-bottom-color: rgba(255,255,255,0.4); }
  .team-list-card.t1 .tlc-total { background: var(--t1); }
  .team-list-card.t2 .tlc-total { background: #d97706; }
  .team-list-card.t3 .tlc-total { background: var(--t3); }
  .strength-teams .team-list-card { padding: 10px 16px; min-width: 150px; }

  .cap-row {
    display: grid;
    grid-template-columns: 180px 28px 120px 28px 100px;
    align-items: end;
    justify-content: center;
    justify-items: center;
    gap: 14px;
  }
  .cap-row .cap-team { display: flex; justify-content: center; }
  .cap-row .cap-op { font-family: 'EB Garamond', serif; font-size: 34px; color: var(--muted); text-align: center; padding-bottom: 22px; }
  .cap-row .cap-team-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .cap-row .cap-patients-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .cap-row .cap-patients { display: flex; align-items: flex-end; justify-content: center; gap: 6px; min-height: 64px; }
  .cap-row .cap-stacked { text-align: center; }
  .cap-row .cap-stacked .cap-num {
    font-family: 'EB Garamond', serif; font-size: 28px; font-weight: 600; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .cap-row .cap-stacked .cap-label {
    font-family: 'Inter', system-ui, sans-serif; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.18em;
    margin-top: 4px; font-weight: 600;
  }
  .cap-row .cap-team-wrap .team-list-card .tlc-total { display: none; }
  .cap-row .cap-team-wrap .team-list-card { padding-bottom: 10px; }
  .cap-row .cap-patients .pm {
    width: 34px; border-radius: 4px; color: #fff;
    border: 1.5px solid var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 700;
  }
  .cap-row .cap-patients .pm span { line-height: 1; }
  .cap-row .cap-score .cap-num, .cap-row .cap-score .cap-label { color: #1a3a7b; }
  .cap-divider { border-top: 1px solid var(--border); margin: 2px 0; }
  .strength-teams .team-list-card .tlc-title { font-size: 17px; margin-bottom: 4px; }

  .formula-card, .group-card {
    margin-top: 20px;
    padding: 40px 56px;
    background: linear-gradient(180deg, #ffffff 0%, #f5f7fa 100%);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(26, 58, 123, 0.08), 0 2px 6px rgba(0,0,0,0.04);
  }
  .formula-card { padding: 56px 80px; }
  .formula {
    font-family: 'EB Garamond', serif;
    font-size: 72px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    color: var(--ink);
  }
  .f-frac {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    line-height: 1.2;
  }
  .f-frac .f-bar {
    height: 3px;
    background: var(--ink);
    width: 100%;
    min-width: 260px;
    border-radius: 2px;
    margin: 4px 0;
  }
  .f-term {
    font-weight: 400;
    display: inline-grid;
  }
  .f-term::before {
    content: attr(data-text);
    font-weight: 700;
    visibility: hidden;
    grid-area: 1 / 1;
    height: 0;
  }
  .f-term > span {
    grid-area: 1 / 1;
  }
  .f-strength { color: #2e7d32; animation: empTerm 1.2s ease-out forwards; animation-delay: 0.3s; }
  .f-load     { color: #c0392b; animation: empTerm 1.2s ease-out forwards; animation-delay: 1.3s; }
  .f-capacity { color: #1a3a7b; animation: empCap 1.2s ease-out forwards; animation-delay: 2.3s; }
  .f-eq { color: var(--muted); font-weight: 300; margin: 0 8px; }

  .formula-mini {
    font-family: 'EB Garamond', serif;
    font-size: 30px;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    gap: 14px;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .formula-mini .f-frac { gap: 4px; line-height: 1.15; }
  .formula-mini .f-bar { height: 1.5px; min-width: 90px; background: currentColor; border-radius: 1px; margin: 2px 0; }
  .formula-mini .fm-strength { color: #2e7d32; font-weight: 400; }
  .formula-mini .fm-load { color: #c0392b; font-weight: 400; }
  .formula-mini .fm-capacity { color: #1a3a7b; font-weight: 400; }

  .formula-footnote {
    position: absolute;
    bottom: 28px;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    opacity: 0.55;
  }
  .formula-footnote .formula-mini { font-size: 22px; margin: 0; }
  .formula-footnote .f-bar { min-width: 64px; }

  .weights-table {
    width: 100%;
    max-width: 440px;
    border-collapse: collapse;
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 13px;
  }
  .weights-table th, .weights-table td {
    padding: 2px 8px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    line-height: 1.3;
  }
  .weights-table th:last-child, .weights-table td:last-child { text-align: right; }
  .weights-table th {
    font-weight: 700;
    color: var(--ink);
    border-bottom: 1.5px solid var(--ink);
  }
  .weights-table td { color: var(--muted); }
  .weights-table tr:last-child td { border-bottom: none; }
  @keyframes empTerm {
    0%, 100% { font-weight: 400; transform: scale(1); }
    30%, 60% { font-weight: 700; transform: scale(1.08); }
  }
  @keyframes empCap {
    0%   { font-weight: 400; transform: scale(1); }
    100% { font-weight: 700; transform: scale(1.12); }
  }

  .interlude {
    background: #fef3c7;
    border-left: 3px solid #f59e0b;
    padding: 12px 16px;
    margin: 12px 0;
    border-radius: 4px;
    font-size: 14px;
  }

  /* Slide 10: 9:54 AM zero-state */
  .s955-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr);
    gap: 16px;
    align-items: start;
  }
  .s955-left { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .s955-right { min-width: 0; }
  .s955-card { padding: 10px 14px !important; }
  .s955-row {
    display: grid !important;
    grid-template-columns: 48px 1fr auto auto;
    align-items: center;
    gap: 12px !important;
    justify-items: center;
  }
  .s955-row .dv-team { width: auto; font-size: 14px; text-align: right; justify-self: end; }
  .s955-row .dv-fraction { min-width: 0; width: 100%; }
  .s955-row .dv-num-wrap,
  .s955-row .dv-den-wrap { gap: 10px; }
  .s955-row .dv-num, .s955-row .dv-den { font-size: 22px; }
  .s955-row .dv-eq { font-size: 24px; color: var(--muted); }
  .s955-row .dv-cap { font-size: 34px; line-height: 1; }
  .s955-row .dv-cap-lbl { font-size: 10px; margin-top: 2px; }
  .s955-row .dv-mini-card { font-size: 10px; padding: 3px 6px; min-width: 0; }
  .s955-row .dv-mini-card ul li { gap: 8px; white-space: nowrap; }
  .s955-row .dv-mini-card ul li .w { min-width: 26px; text-align: right; }
  .s955-row .dv-bar { margin: 4px 0; }
  .s955-right .chart { width: 100%; height: auto; }
  .s955-right .chart-wrap { margin: 0 !important; }
  .s955-fadein { animation: s955FadeIn 0.5s ease forwards; }
  @keyframes s955FadeIn {
    from { opacity: 0; transform: translateY(2px); }
    to   { opacity: 1; transform: none; }
  }
  /* Override patientArrive ring to yellow on slide 10 so the new chip pulses yellow. */
  .s955-slide .dv-mp.just-arrived {
    animation: s955PatientArrive 0.6s cubic-bezier(.2, .8, .2, 1.2);
  }
  @keyframes s955PatientArrive {
    0%   { transform: scale(0.25); opacity: 0; box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.85); }
    45%  { transform: scale(1.22); opacity: 1; box-shadow: 0 0 0 5px rgba(245, 158, 11, 0.45); }
    100% { transform: scale(1);    opacity: 1; box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
  }

  /* Animated Divide slide: numbers tumble into the formula template */
  .dv-stack { display: flex; flex-direction: column; gap: 14px; }
  .dv-row {
    display: flex; align-items: center; justify-content: center;
    gap: 24px;
    font-family: 'EB Garamond', serif;
  }
  .dv-team {
    font-size: 18px; font-weight: 500;
    color: var(--muted);
    width: 72px; text-align: right;
    opacity: 0;
    animation: dvFadeIn 0.5s ease forwards;
    animation-delay: var(--dv-base);
  }
  .dv-fraction {
    display: flex; flex-direction: column; align-items: stretch;
    min-width: 140px;
    text-align: center;
  }
  .dv-num, .dv-den {
    font-size: 38px; line-height: 1;
    font-variant-numeric: tabular-nums;
    font-weight: 500;
    opacity: 0;
  }
  .dv-strength { color: #2e7d32; }
  .dv-load { color: #c0392b; }
  .dv-num {
    animation: dvNumIn 0.55s cubic-bezier(.2,.8,.2,1) forwards;
    animation-delay: calc(var(--dv-base) + 0.2s);
  }
  .dv-den {
    animation: dvDenIn 0.55s cubic-bezier(.2,.8,.2,1) forwards;
    animation-delay: calc(var(--dv-base) + 0.8s);
  }
  .dv-bar {
    height: 3px; width: 100%;
    background: var(--ink);
    border-radius: 2px;
    margin: 8px 0;
    transform: scaleX(0);
    transform-origin: center;
    animation: dvBarIn 0.45s cubic-bezier(.2,.8,.2,1) forwards;
    animation-delay: calc(var(--dv-base) + 0.55s);
  }
  .dv-eq {
    font-size: 40px;
    color: var(--muted);
    font-weight: 300;
    opacity: 0;
    animation: dvFadeIn 0.35s ease forwards;
    animation-delay: calc(var(--dv-base) + 1.45s);
  }
  .dv-cap-wrap {
    display: flex; flex-direction: column; align-items: center;
    min-width: 108px;
  }
  .dv-cap {
    font-size: 50px; font-weight: 600;
    color: #1a3a7b;
    opacity: 0;
    transform: scale(0.5);
    animation: dvCapIn 0.7s cubic-bezier(.2,.8,.2,1.2) forwards;
    animation-delay: calc(var(--dv-base) + 1.75s);
    font-variant-numeric: tabular-nums;
    text-align: center;
    line-height: 1;
  }
  .dv-cap-lbl {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 18px;
    color: #1a3a7b;
    font-weight: 700;
    margin-top: 2px;
    line-height: 1;
    opacity: 0;
    animation: dvFadeIn 0.5s ease forwards;
    animation-delay: calc(var(--dv-base) + 2.15s);
  }
  @keyframes dvFadeIn { to { opacity: 1; } }
  @keyframes dvNumIn {
    from { opacity: 0; transform: translateY(-22px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes dvDenIn {
    from { opacity: 0; transform: translateY(22px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes dvBarIn {
    to { transform: scaleX(1); }
  }
  @keyframes dvCapIn {
    0% { opacity: 0; transform: scale(0.5); }
    60% { opacity: 1; transform: scale(1.18); }
    100% { opacity: 1; transform: scale(1); }
  }

  /* Mini recap cards inside the fraction */
  .dv-num-wrap, .dv-den-wrap {
    display: flex; align-items: center; justify-content: center;
    gap: 12px;
  }
  .dv-mini-card {
    border: 1.2px solid var(--ink);
    border-radius: 6px;
    padding: 4px 8px;
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 10px;
    line-height: 1.4;
    color: var(--ink);
    min-width: 104px;
    text-align: left;
    opacity: 0;
    animation: dvFadeIn 0.5s ease forwards;
    animation-delay: calc(var(--dv-base) + 0.55s);
  }
  .dv-mini-card.t1 { border-color: var(--t1); }
  .dv-mini-card.t2 { border-color: #d97706; }
  .dv-mini-card ul { list-style: none; margin: 0; padding: 0; }
  .dv-mini-card li {
    display: flex; justify-content: space-between; gap: 10px;
  }
  .dv-mini-card li .w {
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .dv-mini-card li.pgy1-highlight {
    color: var(--t1);
    font-weight: 700;
    text-shadow: 0 0 6px rgba(31, 138, 138, 0.55);
  }
  .dv-mini-card li.pgy1-highlight .w {
    color: var(--t1);
  }
  .dv-mini-patients {
    display: flex; gap: 3px; align-items: center;
    opacity: 0;
    animation: dvFadeIn 0.5s ease forwards;
    animation-delay: calc(var(--dv-base) + 1.15s);
  }
  .dv-mp {
    height: 24px;
    color: #fff;
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 10px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    border-radius: 4px;
    border: 1.2px solid var(--ink);
  }
  .dv-mp.red { background: #c0392b; }
  .dv-mp.purple { background: #7b1fa2; }
  .dv-mp.yellow { background: #b8a000; }

  /* Capacity-cap shading: rendered into every chart that passes capShade,
     but hidden by default. The parent slide adds `.slide-shades` to reveal. */
  .cap-shade { opacity: 0; transition: opacity 500ms ease; }
  .slide-shades .cap-shade { opacity: 1; }

  /* Team-focus AUC mode: parent slide adds `.focus-T1|T2|T3` to fill the
     focused team's area and dim the other two teams' lines + dots. */
  .team-area { opacity: 0; transition: opacity 400ms ease; }
  .focus-T1 .area-T1, .focus-T2 .area-T2, .focus-T3 .area-T3 { opacity: 0.32; }
  .load-min-label { opacity: 0; transition: opacity 350ms ease; }
  .focus-T1 .load-min-T1, .focus-T2 .load-min-T2, .focus-T3 .load-min-T3 { opacity: 1; }
  .chart path.line-T1, .chart path.line-T2, .chart path.line-T3,
  .chart .patient-dot, .chart .patient-dot-label { transition: opacity 350ms ease; }
  .focus-T1 .line-T2, .focus-T1 .line-T3,
  .focus-T1 .patient-dot[data-team="T2"], .focus-T1 .patient-dot[data-team="T3"],
  .focus-T1 .patient-dot-label[data-team="T2"], .focus-T1 .patient-dot-label[data-team="T3"] { opacity: 0.07; }
  .focus-T2 .line-T1, .focus-T2 .line-T3,
  .focus-T2 .patient-dot[data-team="T1"], .focus-T2 .patient-dot[data-team="T3"],
  .focus-T2 .patient-dot-label[data-team="T1"], .focus-T2 .patient-dot-label[data-team="T3"] { opacity: 0.07; }
  .focus-T3 .line-T1, .focus-T3 .line-T2,
  .focus-T3 .patient-dot[data-team="T1"], .focus-T3 .patient-dot[data-team="T2"],
  .focus-T3 .patient-dot-label[data-team="T1"], .focus-T3 .patient-dot-label[data-team="T2"] { opacity: 0.07; }

  /* Dynamic "Decide." slide: disables all fade-in animations, adds live card */
  .dyn-slide .dv-team,
  .dyn-slide .dv-num,
  .dyn-slide .dv-den,
  .dyn-slide .dv-bar,
  .dyn-slide .dv-eq,
  .dyn-slide .dv-cap,
  .dyn-slide .dv-cap-lbl,
  .dyn-slide .dv-mini-card,
  .dyn-slide .dv-mini-patients {
    animation: none !important;
    opacity: 1 !important;
    transform: none !important;
  }
  .dyn-slide .dv-mp {
    overflow: hidden;
    white-space: nowrap;
    min-width: 2px;
  }
  .dyn-slide .dv-mp.just-arrived {
    animation: patientArrive 0.6s cubic-bezier(.2, .8, .2, 1.2);
  }
  @keyframes patientArrive {
    0%   { transform: scale(0.25); opacity: 0; box-shadow: 0 0 0 0 rgba(46,125,50,0.8); }
    45%  { transform: scale(1.22); opacity: 1; box-shadow: 0 0 0 5px rgba(46,125,50,0.38); }
    100% { transform: scale(1);    opacity: 1; box-shadow: 0 0 0 0 rgba(46,125,50,0); }
  }
  .dyn-card {
    transition: box-shadow 0.35s ease;
  }
  .dyn-card.dyn-winner {
    box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.6), 0 12px 30px rgba(46, 125, 50, 0.22);
  }
  .dyn-card.dyn-winner.dyn-disagree {
    box-shadow: 0 0 0 3px rgba(192, 57, 43, 0.65), 0 12px 30px rgba(192, 57, 43, 0.25);
  }
  .dyn-card.dyn-winner.dyn-staffing {
    box-shadow: 0 0 0 3px rgba(31, 138, 138, 0.65), 0 12px 30px rgba(31, 138, 138, 0.25);
  }
  .dyn-caption {
    min-height: 24px;
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 17px;
    line-height: 1.3;
    color: var(--ink);
    text-align: center;
    opacity: 0;
    transition: opacity 0.3s ease;
    margin-bottom: 8px;
    padding: 0 12px;
  }
  .dyn-caption.visible { opacity: 1; }
  .dyn-next-hint {
    display: inline-block;
    margin-left: 14px;
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.06em;
    color: var(--muted);
    opacity: 0.8;
    animation: hintPulse 1.6s ease-in-out infinite;
  }
  @keyframes hintPulse {
    0%, 100% { opacity: 0.45; }
    50%      { opacity: 0.95; }
  }

  /* ============================================================
     Mobile / iPhone: fit every slide in viewport without scrolling
     ============================================================ */
  @media (max-width: 600px) {
    main { padding: 6px 8px 68px; min-height: calc(100vh - 110px); max-width: 100%; }

    /* Compact header: one row, truncated title, no dots */
    header { padding: 6px 12px; flex-wrap: nowrap; gap: 8px; }
    .title-stack { flex: 1; min-width: 0; overflow: hidden; }
    .eyebrow { font-size: 9px; letter-spacing: 0.08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .step-title { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.25; }
    .progress { display: none; }

    /* Compact bottom nav */
    nav.controls { padding: 6px 10px; }
    nav.controls button { padding: 6px 10px; font-size: 12px; }
    nav.controls .step-counter { font-size: 11px; }

    /* Slide scaffold */
    .slide { padding: 6px 2px; justify-content: flex-start; }
    .slide-title { font-size: 22px; margin: 0 0 8px; line-height: 1.1; }
    .slide-sub { font-size: 12px; margin: 0 0 8px; line-height: 1.4; }
    .problem-eyebrow { font-size: 9px; letter-spacing: 0.16em; margin-bottom: 4px; gap: 6px; }
    .problem-eyebrow::before, .problem-eyebrow::after { width: 16px; }
    .hero-title { font-size: 22px; margin: 4px 0 6px; line-height: 1.15; }
    .lede { font-size: 12px; line-height: 1.4; }

    /* Round-robin diagram */
    .rr-diagram {
      width: min(96vw, 340px);
      height: auto;
      aspect-ratio: 480 / 380;
      margin: 4px auto;
    }
    .rr-team {
      width: 31%;
      padding: 5px 3px 4px;
      font-size: 10px;
      border-radius: 8px;
    }
    .rr-team .docs { height: 38px; gap: 1px; margin-bottom: 1px; }
    .rr-team .docs svg.doc { transform: scale(0.58); transform-origin: bottom center; }
    .rr-caption { font-size: 9px; letter-spacing: 0.1em; }
    .rr-caption-sub { font-size: 10px; }
    .rr-flow { stroke-width: 1.8; stroke-dasharray: 8 6; }

    /* Group / formula cards */
    .group-card, .formula-card {
      padding: 10px 10px !important;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(26, 58, 123, 0.05);
      width: 100%;
    }

    /* Problem/strength/load rows: must stay side-by-side on mobile */
    .teams-row, .patients-row { gap: 4px; flex-wrap: nowrap; width: 100%; }
    .neq { font-size: 18px; }
    .team-list-card, .patient-card { min-width: 0; padding: 6px 6px; flex: 1; }
    .team-list-card .tlc-title, .patient-card .pc-title { font-size: 11px; margin-bottom: 3px; }
    .team-list-card ul, .patient-card ul { font-size: 9px; padding-left: 10px; line-height: 1.25; }
    .team-list-card ul.weighted { font-size: 9px; }
    .team-list-card ul.weighted li .w { font-size: 8px; }
    .team-list-card .tlc-total, .patient-card .pc-weight { font-size: 10px; padding: 4px 8px; margin: 6px -6px -4px; }
    .pc-title { font-size: 12px; }

    /* Formula slide */
    .formula { font-size: 32px; gap: 10px; }
    .formula .f-frac { gap: 8px; }
    .formula .f-frac .f-bar { min-width: 110px; height: 2px; margin: 2px 0; }
    .formula-footnote { bottom: 10px; }
    .formula-footnote .formula-mini { font-size: 12px; }
    .formula-mini { font-size: 18px; gap: 8px; margin-bottom: 8px; }
    .formula-mini .f-bar { min-width: 60px; }

    /* Weights table on Strength slide */
    .weights-table { font-size: 10px; }
    .weights-table th, .weights-table td { padding: 1px 4px; }

    /* Scene / Teams / Rules slides */
    .chart-wrap { padding: 8px 8px; margin: 8px 0; border-radius: 10px; }
    .teams-grid { gap: 6px; margin: 8px 0; grid-template-columns: 1fr 1fr 1fr; }
    .team-card { padding: 8px 6px; }
    .team-card .team-name { font-size: 10px; margin-bottom: 4px; }
    .team-card > div[style*="font-size:13px"] { font-size: 9px !important; margin-bottom: 6px !important; line-height: 1.3 !important; }
    .team-stat-row { font-size: 10px; padding: 1px 0; }
    .team-card > div[style*="font-size:12px"] { font-size: 9px !important; padding-top: 6px !important; margin-top: 6px !important; }
    .rules-grid { gap: 6px; margin: 8px 0; grid-template-columns: 1fr; }
    .rule { padding: 10px 12px; }
    .rule h3 { font-size: 15px; margin: 0 0 4px; }
    .rule p { font-size: 11px; line-height: 1.35; }

    /* Patient slides: the biggest offender */
    .patient-header { padding: 6px 8px; margin-bottom: 6px; gap: 6px; border-radius: 8px; }
    .pnum { font-size: 20px; }
    .ptime { font-size: 11px; }
    .acuity-pill { font-size: 9px; padding: 2px 6px; }
    .acuity-pill .dot-sm { width: 6px; height: 6px; }
    .verdict { font-size: 9px; padding: 2px 6px; margin-left: auto; }
    .interlude { font-size: 10px; padding: 6px 8px; margin: 4px 0; }
    .ratios { gap: 4px; margin: 6px 0; }
    .ratio { padding: 6px 4px; border-radius: 8px; }
    .ratio .label { font-size: 9px; }
    .ratio .value { font-size: 20px; margin-top: 2px; }
    .ratio .sub { font-size: 8px; margin-top: 2px; line-height: 1.2; }
    .narrative { font-size: 11px; padding: 8px 10px; margin: 6px 0; line-height: 1.4; border-radius: 4px; }
    .decision { font-size: 9px; margin-top: 4px; padding-top: 4px; }

    /* Placeholder slides */
    .placeholder { padding: 32px 12px; font-size: 11px; }

    /* Capacity / dynamic slides */
    .cap-row {
      grid-template-columns: 110px 16px 86px 16px 70px;
      gap: 4px;
    }
    .cap-row .cap-op { font-size: 18px; padding-bottom: 14px; }
    .cap-row .cap-stacked .cap-num { font-size: 16px; }
    .cap-row .cap-stacked .cap-label { font-size: 8px; letter-spacing: 0.1em; }
    .cap-row .cap-patients .pm { width: 22px; font-size: 8px; }
    .strength-teams .team-list-card { min-width: 0; padding: 6px 6px; }
    .strength-teams .team-list-card .tlc-title { font-size: 11px; }

    /* Divide slide */
    .dv-team { font-size: 10px; width: 44px; }
    .dv-num, .dv-den { font-size: 20px; }
    .dv-cap { font-size: 26px; }
    .dv-cap-lbl { font-size: 10px; }
    .dv-eq { font-size: 22px; }
    .dv-row { gap: 8px; }
    .dv-mini-card { min-width: 62px; font-size: 8px; padding: 3px 4px; }
    .dv-mp { height: 14px; font-size: 8px; }
    .dyn-caption { font-size: 11px; margin-bottom: 4px; }

    /* NYUBK intro (slide 9): let lede wrap naturally */
    .lede { max-width: 100%; width: auto; }

    /* Walkthrough slides 10-27: stack team rows and chart vertically */
    .s955-grid { grid-template-columns: 1fr; gap: 8px; }
    .s955-card { padding: 6px 8px !important; }
    .s955-row {
      grid-template-columns: 36px minmax(0, 1fr) auto auto;
      gap: 6px !important;
    }
    .s955-row .dv-team { font-size: 11px; }
    .s955-row .dv-num, .s955-row .dv-den { font-size: 16px; }
    .s955-row .dv-eq { font-size: 18px; }
    .s955-row .dv-cap { font-size: 24px; }
    .s955-row .dv-cap-lbl { font-size: 9px; }
    .s955-row .dv-mini-card { font-size: 8px; padding: 2px 4px; }
    .s955-row .dv-mini-card ul li { gap: 4px; }
    .s955-row .dv-mini-card ul li .w { min-width: 18px; }
    .s955-right .chart-wrap { padding: 6px 8px 4px !important; }
    .s955-right .chart-title { font-size: 11px !important; margin-bottom: 4px !important; }
    .s955-right .chart-legend { font-size: 9px !important; gap: 6px !important; }

    /* Comparison slides 28-32: stack the two charts vertically */
    .compare-charts { flex-direction: column; gap: 10px !important; }
    .compare-charts .chart-wrap { padding: 6px 8px 4px !important; width: 100%; }
    .compare-slide .chart-title { font-size: 11px !important; margin-bottom: 4px !important; }
    .compare-slide .chart-legend { font-size: 9px !important; gap: 6px !important; }
  }

  /* Dark mode: the cards and navy capacity numbers were built for light mode only. */
  body.dark .formula-card, body.dark .group-card {
    background: linear-gradient(180deg, #1e293b 0%, #172033 100%);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35), 0 2px 6px rgba(0, 0, 0, 0.2);
  }
  body.dark .dv-cap, body.dark .dv-cap-lbl, body.dark .f-capacity,
  body.dark .formula-mini .fm-capacity,
  body.dark .cap-row .cap-score .cap-num, body.dark .cap-row .cap-score .cap-label { color: #9db8f2; }
  /* Inline styles get rewritten during phase animations, so match by slide, not by style text. */
  body.dark .problem-eyebrow[style*="#1a3a7b"],
  body.dark .s955-slide .problem-eyebrow, body.dark .compare-slide .problem-eyebrow { color: #9db8f2 !important; }
  body.dark .slide-title { color: var(--ink) !important; }
  body.dark .interlude { background: #3a2f10; }

</style>
</head>
<body>
<header>
  <div class="title-stack">
    <div class="eyebrow">Capacity Conscious Triage · Walkthrough</div>
    <div class="step-title" id="stepTitle">Slide 1</div>
  </div>
  <div class="progress" id="progress"></div>
  <button class="mode-toggle" id="modeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>
</header>

<main id="main"></main>

<nav class="controls">
  <button id="prevBtn">← Previous</button>
  <div class="step-meta">
    <span class="step-counter" id="counter">Step 1 of 14</span>
    <span class="copyright">© 2026 New York University</span>
  </div>
  <button id="nextBtn">Next →</button>
</nav>

<script src="walkthrough-model.js"></script>
<script>
// ============================================================
// SCENARIO DATA: every number comes from walkthrough-model.js (CCTWalk),
// which a test ties to the app's constants and scoring engine.
// ============================================================
const WK = window.CCTWalk;
const DECAY = WK.ACUITY;

// The real morning, minutes from 09:55. "formula" is what capacity suggested at
// that moment, given where the earlier patients actually went.
const PATIENTS = WK.replay('actual').map(s => ({
  n: s.n, t: s.t, time: WK.clock(s.t), acuity: s.acuity, actual: s.actual, formula: s.suggested,
}));

const CHART_MIN = 0;
const CHART_MAX = 150; // minutes from T+0 = 09:55

// Compute a team's instantaneous load under an assignment history
function loadAt(team, mins, assignments) {
  // assignments: array of { acuity, team, tArrive }
  return WK.loadAt(team, mins, assignments.map(a => ({ acuity: a.acuity, team: a.team, t: a.tArrive })));
}

// "Formula from scratch" replay: every patient goes to the team capacity suggests,
// from the first arrival on (highest ratio, then least recently assigned, then
// lowest team number, as in the app).
function formulaReplayAssignments() {
  return WK.assignsOf('formula').map(a => ({ acuity: a.acuity, team: a.team, tArrive: a.t }));
}

// Build curves for a given assignment strategy up to step index (1-8)
function curvesThrough(stepPatientIdx, strategy) {
  let assignments;
  if (strategy === 'formula-replay') {
    assignments = formulaReplayAssignments().slice(0, stepPatientIdx);
  } else {
    assignments = PATIENTS.slice(0, stepPatientIdx).map(p => ({
      acuity: p.acuity, team: strategy === 'actual' ? p.actual : p.formula, tArrive: p.t,
    }));
  }
  const pts = [];
  for (let m = -5; m <= CHART_MAX; m++) {
    pts.push({ m, T1: loadAt('T1', m, assignments), T2: loadAt('T2', m, assignments), T3: loadAt('T3', m, assignments) });
  }
  return { pts, assignments };
}

// ============================================================
// CHART RENDERING
// ============================================================
function renderChart({ patientsShown, currentPatient, strategy = 'actual', width = 980, height = 340, xStart = 0, xEnd = CHART_MAX, cutoffMinute = null, hideLegend = false, strokeOnly = false, fullDomain = false, restrictToTeam = null, capShade = null, areasControlled = false, aucLabels = null }) {
  const { pts: allPts, assignments } = curvesThrough(patientsShown, strategy);
  const effectiveCutoff = cutoffMinute == null ? xEnd : cutoffMinute;
  // When fullDomain is true, we draw the whole path to CHART_MAX regardless
  // of cutoffMinute: the caller animates visibility via stroke-dashoffset.
  const pts = fullDomain
    ? allPts.filter(p => p.m >= xStart && p.m <= xEnd)
    : allPts.filter(p => p.m >= xStart && p.m <= effectiveCutoff);
  const margin = { l: 44, r: 20, t: 20, b: 36 };
  const W = width - margin.l - margin.r;
  const H = height - margin.t - margin.b;
  const xRange = xEnd - xStart;
  const xScale = m => margin.l + ((m - xStart) / xRange) * W;
  const maxY = 8;
  const yScale = v => margin.t + H - (v / maxY) * H;

  const pathFor = key => pts.map((p,i) => `${i===0?'M':'L'}${xScale(p.m).toFixed(1)},${yScale(p[key]).toFixed(1)}`).join(' ');
  const areaFor = key => {
    if (!pts.length) return '';
    return pathFor(key) + ` L${xScale(pts[pts.length-1].m).toFixed(1)},${yScale(0).toFixed(1)} L${xScale(pts[0].m).toFixed(1)},${yScale(0).toFixed(1)} Z`;
  };

  // X gridlines every 30 min
  const allXTicks = [-5, 0, 30, 60, 90, 120, 150];
  const allTimeLabels = { [-5]: '09:50', 0: '09:55', 30: '10:25', 60: '10:55', 90: '11:25', 120: '11:55', 150: '12:25' };
  const xTicks = allXTicks.filter(x => x >= xStart && x <= xEnd)
    // Suppress the 09:50 tick whenever the chart starts at -5: at any plot
    // width it ends up crowding the 09:55 label to the point of overlap.
    .filter(x => !(x === -5 && xStart === -5));
  const timeLabels = allTimeLabels;

  const noonX = xScale(125); // T+125 = noon

  let svg = `<svg class="chart" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">`;
  // y-axis label (rotated), centered vertically along the plot area
  svg += `<text x="${margin.l - 30}" y="${margin.t + H / 2}" text-anchor="middle" font-size="11" fill="var(--muted)" transform="rotate(-90, ${margin.l - 30}, ${margin.t + H / 2})" style="letter-spacing:0.08em; text-transform:uppercase;">Team load</text>`;
  // grid
  for (let y = 0; y <= maxY; y += 2) {
    svg += `<line x1="${margin.l}" x2="${margin.l+W}" y1="${yScale(y)}" y2="${yScale(y)}" stroke="var(--grid)" />`;
    svg += `<text x="${margin.l-8}" y="${yScale(y)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${y}</text>`;
  }
  for (const x of xTicks) {
    svg += `<line x1="${xScale(x)}" x2="${xScale(x)}" y1="${margin.t}" y2="${margin.t+H}" stroke="var(--grid)" />`;
    svg += `<text x="${xScale(x)}" y="${margin.t+H+18}" text-anchor="middle" font-size="11" fill="var(--muted)">${timeLabels[x]}</text>`;
  }
  // capacity-cap shading (top region above a load threshold): always emitted
  // when capShade is provided, but visibility is controlled by `.slide-shades`
  // on the parent slide so steps can fade the shade in/out without re-render.
  if (capShade) {
    const yCap = yScale(capShade.threshold);
    svg += `<rect class="cap-shade" x="${margin.l}" y="${margin.t}" width="${W}" height="${yCap - margin.t}" fill="${capShade.fill}" />`;
    svg += `<line class="cap-shade" x1="${margin.l}" x2="${margin.l+W}" y1="${yCap}" y2="${yCap}" stroke="${capShade.stroke}" stroke-dasharray="5,4" stroke-width="1.4" />`;
    if (capShade.label) {
      svg += `<text class="cap-shade" x="${margin.l+W-8}" y="${yCap-6}" text-anchor="end" font-size="11" font-weight="700" fill="${capShade.stroke}">${capShade.label}</text>`;
    }
  }
  // noon marker: always emitted so the walkthrough can fade it in/out with
  // the staffing-change phase. Visibility managed by setupWalkthroughChart.
  if (patientsShown >= 6) {
    svg += `<line class="noon-marker" x1="${noonX}" x2="${noonX}" y1="${margin.t}" y2="${margin.t+H}" stroke="#f59e0b" stroke-dasharray="4,3" stroke-width="1.2" opacity="0" />`;
    svg += `<text class="noon-label" x="${noonX-6}" y="${margin.t+14}" text-anchor="end" font-size="10" fill="#b45309" opacity="0">noon · intern joins <tspan font-weight="700" fill="var(--t1)">T1</tspan></text>`;
  }
  // areas (skipped in strokeOnly mode: e.g. during the early walkthrough
  // where we haven't introduced load-minutes / area-under-curve yet). When
  // `areasControlled` is true, emit paths with the `team-area` CSS hook
  // so the parent slide can fade them in via a `.focus-T{N}` class.
  if (areasControlled) {
    svg += `<path class="team-area area-T1" data-team="T1" d="${areaFor('T1')}" fill="var(--t1)" />`;
    svg += `<path class="team-area area-T2" data-team="T2" d="${areaFor('T2')}" fill="var(--t2)" />`;
    svg += `<path class="team-area area-T3" data-team="T3" d="${areaFor('T3')}" fill="var(--t3)" />`;
  } else if (!strokeOnly) {
    svg += `<path d="${areaFor('T1')}" fill="var(--t1)" opacity="0.08" />`;
    svg += `<path d="${areaFor('T2')}" fill="var(--t2)" opacity="0.08" />`;
    svg += `<path d="${areaFor('T3')}" fill="var(--t3)" opacity="0.08" />`;
  }
  // lines
  const showLine = (tid) => !restrictToTeam || restrictToTeam === tid;
  if (showLine('T1')) svg += `<path class="line-T1" data-team="T1" d="${pathFor('T1')}" fill="none" stroke="var(--t1)" stroke-width="2" />`;
  if (showLine('T2')) svg += `<path class="line-T2" data-team="T2" d="${pathFor('T2')}" fill="none" stroke="var(--t2)" stroke-width="2" />`;
  if (showLine('T3')) svg += `<path class="line-T3" data-team="T3" d="${pathFor('T3')}" fill="none" stroke="var(--t3)" stroke-width="2" />`;

  // AUC labels for team-focus mode: three stacked team-colored labels in
  // the top-left of the plot area (clear of the noon marker on the right).
  // Visibility is controlled by `.focus-T{N}` on the parent slide.
  if (aucLabels) {
    const lx = margin.l + 12;
    const ly = margin.t + 22;
    ['T1', 'T2', 'T3'].forEach(tid => {
      if (aucLabels[tid] != null) {
        svg += `<text class="load-min-label load-min-${tid}" x="${lx}" y="${ly}" text-anchor="start" font-size="18" font-weight="700" fill="var(--${tid.toLowerCase()})">${aucLabels[tid]} load-minutes</text>`;
      }
    });
  }

  // patient dots
  for (let i = 0; i < patientsShown; i++) {
    const p = PATIENTS[i];
    const team = strategy === 'actual' ? p.actual
               : (assignments[i] ? assignments[i].team : p.formula);
    if (restrictToTeam && team !== restrictToTeam) continue;
    const colorMap = { Red: 'var(--red)', Yellow: 'var(--yellow)', Purple: 'var(--purple)' };
    const isCurrent = (i + 1) === currentPatient;
    const r = isCurrent ? 8 : 5;
    const y = yScale(loadAt(team, p.t, assignments.slice(0, i+1)));
    svg += `<circle class="patient-dot" data-patient="${p.n}" data-team="${team}" data-minute="${p.t}" cx="${xScale(p.t)}" cy="${y}" r="${r}" fill="${colorMap[p.acuity]}" stroke="white" stroke-width="${isCurrent ? 2.5 : 1.5}" />`;
    svg += `<text class="patient-dot-label" data-patient="${p.n}" data-team="${team}" data-minute="${p.t}" x="${xScale(p.t)}" y="${y - r - 4}" text-anchor="middle" font-size="10" font-weight="600" fill="var(--ink)">${p.n}</text>`;
  }

  // legend
  if (!hideLegend) {
  const lg = margin.l + W - 200;
  svg += `<g transform="translate(${lg}, ${margin.t})">`;
  ['T1','T2','T3'].forEach((t,i) => {
    svg += `<line x1="0" x2="16" y1="${i*16}" y2="${i*16}" stroke="var(--${t.toLowerCase()})" stroke-width="2.5" />`;
    svg += `<text x="22" y="${i*16+4}" font-size="11" fill="var(--ink)">${t}</text>`;
  });
  svg += `</g>`;
  }

  svg += `</svg>`;
  return svg;
}

// ============================================================
// STEP RENDERERS
// ============================================================
function stepNYUBK() {
  return `
    <div class="slide">
      <h1 class="hero-title serif" style="text-wrap:balance">Let’s use a real-life example.</h1>
      <p class="lede" style="margin: 18px 0">One morning, 146 minutes, eight critical patients arrived to NYU BK.<br>
Here’s how capacity-conscious routing would have compared to what actually occurred. These were the teams that day:</p>
      <div class="group-card strength-teams" style="padding:16px 24px; margin-top:12px"><div class="teams-row" style="gap:14px">
        ${tsCard('Team 1', WK.providerRows(WK.rolesAt('T1', 0)), 't1')}
        ${tsCard('Team 2', WK.providerRows(WK.rolesAt('T2', 0)), 't2')}
        ${tsCard('Team 3', WK.providerRows(WK.rolesAt('T3', 0)), 't3')}
      </div></div>
      <p style="margin-top:20px;font-size:12px;color:var(--muted);font-style:italic;text-align:center">
        Actual provider schedules on this day; names replaced with role titles. An intern joined Team 1 at noon.
      </p>
    </div>
  `;
}

// ---- Slide 10 helpers (phased patient arrivals) ----
// Tracks cumulative state per phase. Phase 0 = empty board (9:54).
// Phase N = after patient N arrives.
const S955_TEAMS = {
  T1: { name: 'Team 1', cls: 't1' },
  T2: { name: 'Team 2', cls: 't2' },
  T3: { name: 'Team 3', cls: 't3' },
};

// A team's roster, strength and patient chips at a phase, all from the model.
// "at" is the minute the phase shows; "patientsShown" is how many patients have
// been placed (where they actually went).
function phaseTeam(ph, tid) {
  const roles = WK.rolesAt(tid, ph.at);
  return {
    ...S955_TEAMS[tid],
    strength: WK.strengthAt(tid, ph.at),
    providers: WK.providerRows(roles, tid === 'T1' && ph.at >= WK.NOON ? 'intern' : null),
  };
}
function phaseChips(ph, tid) {
  return WK.chipsAt(tid, ph.at, WK.assignsOf('actual', ph.patientsShown));
}

// Helpers for the phase text.
const HIST = WK.replay('actual');
const rAt = (tid, min, k) => WK.formatRatio(WK.ratio(WK.strengthAt(tid, min), WK.loadAt(tid, min, WK.assignsOf('actual', k))));
const wAt = (n, min) => { const a = WK.ARRIVALS[n - 1]; return WK.weightAt(a.acuity, min - a.t); };
const teamName = tid => 'Team ' + tid.slice(1);
const recLine = (n, again) => `<span style="color:#2e7d32">Formula ${again ? 'again ' : ''}recommends ${teamName(HIST[n - 1].suggested)}.</span>`;
const DISAGREEMENTS = HIST.filter(s => s.suggested !== s.actual).length;
const HIST_COUNTS = WK.counts('actual');

// Each phase: time label, heading, subtitle, which team(s) to outline, the minute it
// shows ("at"), how many patients have been placed, and where the chart pen stops.
// Strengths, loads, ratios and suggestions in the text come from the model.
const Y = '<span style="color:#b8a000">';
const arrive = n => ({ kind: 'arrive', n, highlights: [HIST[n - 1].suggested], patientsShown: n - 1, currentPatient: n > 1 ? n - 1 : null, at: WK.ARRIVALS[n - 1].t });
const place = n => ({ kind: 'place', n, highlights: [HIST[n - 1].actual], disagree: HIST[n - 1].suggested !== HIST[n - 1].actual, patientsShown: n, currentPatient: n, at: WK.ARRIVALS[n - 1].t });
const S955_PHASES = [
  {
    time: '09:54 AM',
    heading: 'All three teams start with zero patients.',
    subtitle: 'Infinite capacities all around, no wrong decision.',
    highlights: [], patientsShown: 0, currentPatient: null, at: 0,
    cutoffMinute: -1,
  },
  {
    time: '09:55 · <span style="color:var(--purple)">PATIENT 1</span>',
    heading: 'A <span style="color:var(--purple)">purple</span> patient arrives.',
    subtitle: '<span style="color:#2e7d32">Formula recommends any of these teams.</span>',
    ...arrive(1), highlights: ['T1', 'T2', 'T3'],
    cutoffMinute: -1,
  },
  {
    time: '09:55 · <span style="color:var(--purple)">PATIENT 1</span>',
    heading: 'A <span style="color:var(--purple)">purple</span> patient arrives.',
    subtitle: 'Historical routing sends it to Team 1. No disagreements here.<br><span style="color:#2e7d32">Formula recommends any of these teams.</span>',
    ...place(1),
    cutoffMinute: 0,
  },
  {
    time: `${WK.clock(50)} · ${Y}PATIENT 2</span>`,
    heading: `Fifty minutes of quiet, then a ${Y}yellow</span> patient arrives.`,
    subtitle: `Team 1's purple has decayed to ${wAt(1, 50).toFixed(1)}. T1's ratio is high but finite; T2 and T3 are still empty.<br>${recLine(2)}`,
    ...arrive(2),
    cutoffMinute: 50,
  },
  {
    time: `${WK.clock(50)} · ${Y}PATIENT 2</span>`,
    heading: `The ${Y}Yellow</span> goes to Team 1. <span style="color:var(--red)">Methods disagree.</span>`,
    subtitle: 'T1 now carries two patients while T2 and T3 sit empty.<br>A minor difference on its own,<br>but it sets up a compounding problem.',
    ...place(2),
    cutoffMinute: 51,
  },
  {
    time: `${WK.clock(51)} · <span style="color:var(--red)">PATIENT 3</span>`,
    heading: 'A minute later, a <span style="color:var(--red)">red</span> patient arrives, the sickest of the morning.',
    subtitle: `Team 1 just absorbed Patient 2, dropping its ratio to ${rAt('T1', 51, 2)}. Teams 2 and 3 are still empty.<br>${recLine(3)}`,
    ...arrive(3),
    cutoffMinute: 51,
  },
  {
    time: `${WK.clock(51)} · <span style="color:var(--red)">PATIENT 3</span>`,
    heading: 'The <span style="color:var(--red)">Red</span> goes to Team 2. <span style="color:#2e7d32">Both agree.</span>',
    subtitle: 'The right call by any measure, the sickest patient goes to an empty team.',
    ...place(3),
    cutoffMinute: 52,
  },
  {
    time: `${WK.clock(64)} · ${Y}PATIENT 4</span>`,
    heading: `Thirteen minutes later, another ${Y}yellow</span> patient arrives.`,
    subtitle: `Team 2's Red (weight ${wAt(3, 64).toFixed(2)}) is pushing its capacity to ${rAt('T2', 64, 3)}. T1 still carries two, now at ${rAt('T1', 64, 3)}.<br>Team 3 is still empty, 64 minutes in.<br>${recLine(4)}`,
    ...arrive(4),
    cutoffMinute: 64,
  },
  {
    time: `${WK.clock(64)} · ${Y}PATIENT 4</span>`,
    heading: `The ${Y}Yellow</span> goes to Team 1. <span style="color:var(--red)">Methods disagree.</span>`,
    subtitle: 'Historical routing lands the Yellow on Team 1, now at three patients. Team 3 stays idle.',
    ...place(4),
    cutoffMinute: 65,
  },
  {
    time: `${WK.clock(86)} · ${Y}PATIENT 5</span>`,
    heading: `Twenty-two minutes of quiet, then another ${Y}yellow</span> patient arrives.`,
    subtitle: `Team 2's Red has decayed from ${DECAY.Red.w.toFixed(1)} to about ${wAt(3, 86).toFixed(2)}, improving its ratio to ${rAt('T2', 86, 4)}.<br>Team 1 carries three patients at ${rAt('T1', 86, 4)}. Team 3 is still empty with an infinite ratio.<br>${recLine(5, true)}`,
    ...arrive(5),
    cutoffMinute: 85,
  },
  {
    time: `${WK.clock(86)} · ${Y}PATIENT 5</span>`,
    heading: 'Historical routing sends to Team 2, <span style="color:var(--red)">another disagreement.</span>',
    subtitle: 'The attending and senior resident on Team 3 remain unused, 86 minutes into the window.',
    ...place(5),
    cutoffMinute: 87,
  },
  {
    time: '12:00 PM · NOON',
    heading: 'A <span style="color:var(--t1)">PGY-1 intern</span> joins Team 1.',
    subtitle: `Team 1's strength rises from ${WK.strengthAt('T1', WK.NOON - 1).toFixed(1)} to ${WK.strengthAt('T1', WK.NOON).toFixed(1)}.`,
    highlights: ['T1'], staffing: true, patientsShown: 5, currentPatient: 5, at: WK.NOON,
    cutoffMinute: 125,
  },
  {
    time: `${WK.clock(127)} · ${Y}PATIENT 6</span>`,
    heading: `Forty-one minutes of quiet, then another ${Y}yellow</span> patient arrives.`,
    subtitle: `With the intern on board and the Yellows decaying, Team 1's capacity climbs to ${rAt('T1', 127, 5)}.<br>Team 2 sits at ${rAt('T2', 127, 5)} with two patients. Team 3 is still empty, over two hours in.<br>${recLine(6)}`,
    ...arrive(6),
    cutoffMinute: 127,
  },
  {
    time: `${WK.clock(127)} · ${Y}PATIENT 6</span>`,
    heading: 'Historical routing sends to Team 2 again, <span style="color:var(--red)">a fourth disagreement.</span>',
    subtitle: 'Team 2 now carries three patients. Team 3 stays idle for the <strong>6th consecutive patient</strong>.',
    ...place(6),
    cutoffMinute: 128,
  },
  {
    time: `${WK.clock(131)} · ${Y}PATIENT 7</span>`,
    heading: `Four minutes later, another ${Y}yellow</span> patient arrives.`,
    subtitle: `Team 2 now carries three patients, dropping its capacity to ${rAt('T2', 131, 6)}.<br>Team 1 sits at ${rAt('T1', 131, 6)} with its enhanced strength. Team 3 is still empty, 131 minutes in.<br>${recLine(7)}`,
    ...arrive(7),
    cutoffMinute: 131,
  },
  {
    time: `${WK.clock(131)} · ${Y}PATIENT 7</span>`,
    heading: 'Team 3 gets its first patient. <span style="color:#2e7d32">Both agree.</span>',
    subtitle: `One of the most experienced residents in the ER finally gets put to work...<br><strong>${WK.ARRIVALS[6].t} minutes into the window.</strong>`,
    ...place(7),
    cutoffMinute: 132,
  },
  {
    time: `${WK.clock(146)} · ${Y}PATIENT 8</span>`,
    heading: `Fifteen minutes later, the final ${Y}yellow</span> patient arrives.`,
    subtitle: `All three ratios are finite for the first time: T1 at ${rAt('T1', 146, 7)}, T3 at ${rAt('T3', 146, 7)}, T2 at ${rAt('T2', 146, 7)}.<br>${recLine(8)}`,
    ...arrive(8),
    cutoffMinute: 146,
  },
  {
    time: `${WK.clock(146)} · ${Y}PATIENT 8</span>`,
    heading: 'The final patient goes to Team 1. <span style="color:#2e7d32">Both agree.</span>',
    subtitle: `${WK.WINDOW} minutes, ${WK.ARRIVALS.length} patients, ${DISAGREEMENTS} disagreements.<br>T1 saw ${HIST_COUNTS.T1}, T2 saw ${HIST_COUNTS.T2}, T3 saw ${HIST_COUNTS.T3}.`,
    ...place(8),
    cutoffMinute: 147,
  },
];

function stepStart955(phase = 0) {
  const ph = S955_PHASES[phase] || S955_PHASES[0];

  const miniTeamCard = (cls, providers, highlightPgy1) => {
    const rows = providers.map(([role, w]) => {
      const liCls = highlightPgy1 && /pgy-?1 intern/i.test(role) ? ' class="pgy1-highlight"' : '';
      return `<li${liCls}><span>${role}</span><span class="w">${w}</span></li>`;
    }).join('');
    return `<div class="dv-mini-card ${cls}"><ul>${rows}</ul></div>`;
  };

  const chipHtml = ({ tone, w }) => {
    const scale = 18;
    return `<div class="dv-mp ${tone}" style="width:${w * scale}px">${w.toFixed(1)}</div>`;
  };

  const row = (tid) => {
    const t = phaseTeam(ph, tid);
    const chips = phaseChips(ph, tid);
    const load = chips.reduce((s, c) => s + c.w, 0);
    const capacity = WK.formatRatio(WK.ratio(t.strength, load));
    const isWinner = ph.highlights.includes(tid);
    const disagreeCls = isWinner && ph.disagree ? ' dyn-disagree' : '';
    const staffingCls = isWinner && ph.staffing ? ' dyn-staffing' : '';
    return `
      <div class="group-card s955-card ${isWinner ? 'dyn-winner dyn-card' : 'dyn-card'}${disagreeCls}${staffingCls}" style="padding:12px 18px; margin:0">
        <div class="dv-row s955-row" style="--dv-base:0s">
          <div class="dv-team">${t.name}</div>
          <div class="dv-fraction">
            <div class="dv-num-wrap">
              <span class="dv-strength dv-num">${t.strength.toFixed(1)}</span>
              ${miniTeamCard(t.cls, t.providers, !!ph.staffing && tid === 'T1')}
            </div>
            <div class="dv-bar"></div>
            <div class="dv-den-wrap">
              <span class="dv-load dv-den">${load.toFixed(1)}</span>
              <div class="dv-mini-patients" style="min-height:22px">${chips.map(chipHtml).join('')}</div>
            </div>
          </div>
          <span class="dv-eq">=</span>
          <div class="dv-cap-wrap">
            <span class="dv-cap">${capacity}</span>
            <div class="dv-cap-lbl">Capacity</div>
          </div>
        </div>
      </div>`;
  };

  const eyebrow = ph.time
    ? `<div class="problem-eyebrow" style="color:#1a3a7b;margin-bottom:6px">${ph.time}</div>`
    : '';
  const subtitle = `<p class="slide-sub" style="margin:0 0 14px; font-size:15px; max-width:820px; min-height:68px">${ph.subtitle || ''}</p>`;

  return `
    <div class="slide dyn-slide s955-slide">
      ${eyebrow}
      <h1 class="slide-title serif" style="margin:0 0 6px; font-size:30px; color:#000">${ph.heading}</h1>
      ${subtitle}
      <div class="s955-grid">
        <div class="s955-left">
          ${row('T1')}
          ${row('T2')}
          ${row('T3')}
        </div>
        <div class="s955-right">
          <div class="chart-wrap" style="padding:10px 14px 6px">
            <div class="chart-title" style="font-size:13px;font-weight:600;text-align:center;margin-bottom:6px;color:var(--ink)">
              A 146-minute window of actual A-side patient assignments
            </div>
            ${renderChart({
              patientsShown: 8,            // emit dots for every patient in this walkthrough window (through P8)
              currentPatient: null,        // no dot emphasis: all walkthrough dots same size
              width: 560,
              height: 340,
              xStart: -5,
              hideLegend: true,
              strokeOnly: true,            // no area fills: introduced later when we talk AUC
              fullDomain: true,            // draw paths edge-to-edge; visibility via stroke-dashoffset
            })}
            <div class="chart-legend" style="display:flex;gap:14px;justify-content:center;margin-top:4px;font-size:11px;color:var(--muted);flex-wrap:wrap">
              <span><span style="display:inline-block;width:14px;height:2px;background:var(--t1);vertical-align:middle;margin-right:4px"></span>Team 1</span>
              <span><span style="display:inline-block;width:14px;height:2px;background:var(--t2);vertical-align:middle;margin-right:4px"></span>Team 2</span>
              <span><span style="display:inline-block;width:14px;height:2px;background:var(--t3);vertical-align:middle;margin-right:4px"></span>Team 3</span>
              <span style="color:#c0392b">● Red (+4)</span>
              <span style="color:#b8a000">● Yellow (+2)</span>
              <span style="color:#7b1fa2">● Purple (+1)</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
}

// Partial update for slide 10 phase transitions: keeps DOM intact so
// elements can animate in rather than the whole page re-rendering.
// ---- Walkthrough chart stroke-dashoffset setup ------------------------
// Given a chart-wrap and a target cutoffMinute (what minute the data lines
// should be drawn up to), set stroke-dasharray/offset on each team path so
// the line is "drawn" with a pen up to that x-position. Patient dots are
// shown/hidden based on their arrival minute + the current phase's
// patientsShown count (so a dot appears only once its patient has been
// routed).
//
// When animate:true with a prevCutoff, the change is transitioned. Forward
// (new > prev) extends the line and dots fade in after the pen passes them.
// Reverse (new < prev) fades the departing dot first, THEN retracts the line.
function setupWalkthroughChart(chartWrap, phase, opts = {}) {
  if (!chartWrap) return;
  const svg = chartWrap.querySelector('svg.chart');
  if (!svg) return;
  const ph = S955_PHASES[phase] || S955_PHASES[0];
  const animate = !!opts.animate;
  const prevPhase = opts.prevPhase;
  const prev = prevPhase != null ? S955_PHASES[prevPhase] : null;

  const W = 560, marginL = 44, marginR = 20, xStart = -5, xEnd = 150;
  const plotW = W - marginL - marginR;
  const xScale = m => marginL + ((m - xStart) / (xEnd - xStart)) * plotW;

  // Binary-search the path length at which path(x)=targetX. Paths are
  // monotonically increasing in x, so bisection is safe.
  function lengthAtX(path, targetX) {
    const total = path.getTotalLength();
    if (!isFinite(total) || total <= 0) return 0;
    let lo = 0, hi = total;
    for (let i = 0; i < 24; i++) {
      const mid = (lo + hi) / 2;
      const pt = path.getPointAtLength(mid);
      if (pt.x < targetX) lo = mid; else hi = mid;
    }
    return (lo + hi) / 2;
  }

  const paths = [...svg.querySelectorAll('path[data-team]')];
  const cutoffX = xScale(ph.cutoffMinute);
  const prevCutoffX = prev ? xScale(prev.cutoffMinute) : cutoffX;

  // Compute the target d-string for each team based on the current phase's
  // routed-patient count. For phase K the line should only reflect patients
  // actually routed so far: otherwise a Yellow/Red "jump" appears at the
  // pen tip before the corresponding routing decision has been announced.
  const computePathD = (patientsShown) => {
    const { pts: allPts } = curvesThrough(patientsShown, 'actual');
    const xS = -5, xE = 150;
    const ptsArr = allPts.filter(p => p.m >= xS && p.m <= xE);
    const margin = { l: marginL, r: marginR, t: 20, b: 36 };
    const Wplot = W - margin.l - margin.r;
    const H = 340 - margin.t - margin.b;
    const maxY = 8;
    const yS = v => margin.t + H - (v / maxY) * H;
    const xS2 = m => margin.l + ((m - xS) / (xE - xS)) * Wplot;
    return (key) => ptsArr.map((p, i) =>
      `${i === 0 ? 'M' : 'L'}${xS2(p.m).toFixed(1)},${yS(p[key]).toFixed(1)}`
    ).join(' ');
  };

  const newPathFor = computePathD(ph.patientsShown);
  const oldPathFor = prev ? computePathD(prev.patientsShown) : null;
  const reverse = prev ? ph.cutoffMinute < prev.cutoffMinute : false;

  // Rebuild-timing strategy:
  // - No prev (initial render): swap d immediately, no animation.
  // - Forward: keep d as OLD for a moment to anchor the pen at its last
  //   visible position, then swap to NEW and re-anchor the pen at the
  //   equivalent PRE-JUMP position on the new path (one tick before the
  //   new patient's arrival). This way the ~900ms transition sweeps the
  //   pen ACROSS the new jump, drawing it gradually.
  // - Reverse: keep d as OLD throughout the retraction so any jump being
  //   "un-routed" shrinks visibly, then swap to NEW after retraction
  //   completes.

  if (!prev) {
    // Initial render: just set new paths, no animation.
    paths.forEach(path => {
      const tid = path.getAttribute('data-team');
      const d = newPathFor(tid);
      if (path.getAttribute('d') !== d) path.setAttribute('d', d);
    });
  }

  paths.forEach(path => {
    if (!animate || !prev) {
      const total = path.getTotalLength();
      if (!isFinite(total) || total <= 0) return;
      const lenAtNew = lengthAtX(path, cutoffX);
      path.style.transition = 'none';
      path.style.strokeDasharray = total + 'px';
      path.style.strokeDashoffset = (total - lenAtNew) + 'px';
      return;
    }

    const tid = path.getAttribute('data-team');
    const dOld = oldPathFor(tid);
    const dNew = newPathFor(tid);

    if (reverse) {
      // d stays as OLD during retraction. Ensure it is the old path.
      if (path.getAttribute('d') !== dOld) path.setAttribute('d', dOld);
      const totalOld = path.getTotalLength();
      if (!isFinite(totalOld) || totalOld <= 0) return;

      // If a patient is being un-routed to THIS team and the jump sits
      // at or after the new cutoff, the retraction would otherwise stop
      // with the jump still visible on the old path: and swapping to the
      // new (jump-less) path would snap the line down. Extend retraction
      // one minute past the jump so the pen visibly "erases" it, then
      // silently swap paths in the matching pre-jump region and settle
      // forward to the new cutoff on the new path.
      const tid = path.getAttribute('data-team');
      const removedIdx = ph.patientsShown < prev.patientsShown ? prev.patientsShown - 1 : -1;
      const removed = removedIdx >= 0 ? PATIENTS[removedIdx] : null;
      const jumpM = (removed && removed.actual === tid) ? removed.t : null;
      const needsOvershoot = jumpM != null && ph.cutoffMinute >= jumpM;

      const lenPrev = lengthAtX(path, prevCutoffX);
      path.style.transition = 'none';
      path.style.strokeDasharray = totalOld + 'px';
      path.style.strokeDashoffset = (totalOld - lenPrev) + 'px';
      void path.getBoundingClientRect();

      const delay = 280;
      if (needsOvershoot) {
        const overshootX = xScale(jumpM - 1);
        const lenOvershoot = lengthAtX(path, overshootX);
        const dur1 = 550;
        path.style.transition = `stroke-dashoffset ${dur1}ms cubic-bezier(0.22, 0.9, 0.35, 1) ${delay}ms`;
        requestAnimationFrame(() => {
          path.style.strokeDashoffset = (totalOld - lenOvershoot) + 'px';
        });
        setTimeout(() => {
          path.setAttribute('d', dNew);
          const newTotal = path.getTotalLength();
          if (!isFinite(newTotal) || newTotal <= 0) return;
          const lenOvershootNew = lengthAtX(path, overshootX);
          path.style.transition = 'none';
          path.style.strokeDasharray = newTotal + 'px';
          path.style.strokeDashoffset = (newTotal - lenOvershootNew) + 'px';
          void path.getBoundingClientRect();
          const lenFinalNew = lengthAtX(path, cutoffX);
          const dur2 = 180;
          path.style.transition = `stroke-dashoffset ${dur2}ms ease-out`;
          requestAnimationFrame(() => {
            path.style.strokeDashoffset = (newTotal - lenFinalNew) + 'px';
          });
        }, delay + dur1 + 20);
      } else {
        const lenNew = lengthAtX(path, cutoffX);
        const dur = 650;
        path.style.transition = `stroke-dashoffset ${dur}ms cubic-bezier(0.22, 0.9, 0.35, 1) ${delay}ms`;
        requestAnimationFrame(() => {
          path.style.strokeDashoffset = (totalOld - lenNew) + 'px';
        });
        setTimeout(() => {
          if (dOld === dNew) return;
          path.setAttribute('d', dNew);
          const newTotal = path.getTotalLength();
          if (!isFinite(newTotal) || newTotal <= 0) return;
          const newLen = lengthAtX(path, cutoffX);
          path.style.transition = 'none';
          path.style.strokeDasharray = newTotal + 'px';
          path.style.strokeDashoffset = (newTotal - newLen) + 'px';
        }, dur + delay + 20);
      }
      return;
    }

    // Forward path ----------------------------------------------------
    // Swap d to the NEW path first so the pen draws over it for the whole
    // animation. We anchor the starting dashoffset at the equivalent of
    // the previous cutoff on the new path: but if a new patient was
    // added at or near prev.cutoffMinute, the arc-length at that x on the
    // new path is AFTER the jump (the point at x=prevCutoff is post-jump).
    // To ensure the animation sweeps across the jump, rewind the anchor
    // one minute earlier when a patient was added.
    if (path.getAttribute('d') !== dNew) path.setAttribute('d', dNew);
    const totalNew = path.getTotalLength();
    if (!isFinite(totalNew) || totalNew <= 0) return;
    const addsPatient = ph.patientsShown > prev.patientsShown;
    const anchorMinute = addsPatient
      ? Math.max(-5, prev.cutoffMinute - 1)
      : prev.cutoffMinute;
    const anchorX = xScale(anchorMinute);
    const lenStartOnNew = lengthAtX(path, anchorX);
    const lenEndOnNew = lengthAtX(path, cutoffX);

    // Set starting offset with transition disabled, then flush style so
    // the browser commits it as the baseline.
    path.style.transition = 'none';
    path.style.strokeDasharray = totalNew + 'px';
    path.style.strokeDashoffset = (totalNew - lenStartOnNew) + 'px';
    // Force style recalc to lock in the starting offset.
    void path.getBoundingClientRect();
    // eslint-disable-next-line no-unused-expressions
    getComputedStyle(path).strokeDashoffset;

    const dur = 900;
    path.style.transition = `stroke-dashoffset ${dur}ms cubic-bezier(0.22, 0.9, 0.35, 1)`;
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        path.style.strokeDashoffset = (totalNew - lenEndOnNew) + 'px';
      });
    });
  });

  // Dot visibility. A dot is visible when (a) its minute <= cutoff AND
  // (b) its patient index is within phase.patientsShown (i.e. it has been
  // routed, not merely arrived). Iterate over each (circle, label) pair.
  const dots = [...svg.querySelectorAll('.patient-dot')];
  const labels = [...svg.querySelectorAll('.patient-dot-label')];
  const shouldShow = (minute, n) => (minute <= ph.cutoffMinute) && (n <= ph.patientsShown);
  const shouldShowPrev = (minute, n) => prev
    ? (minute <= prev.cutoffMinute) && (n <= prev.patientsShown)
    : false;

  const setDotState = (el, visible, { fadeDelay = 0, fadeDur = 250 } = {}) => {
    el.style.transition = `opacity ${fadeDur}ms ease ${fadeDelay}ms`;
    el.style.opacity = visible ? '1' : '0';
  };

  [...dots, ...labels].forEach(el => {
    const minute = parseFloat(el.getAttribute('data-minute'));
    const n = parseInt(el.getAttribute('data-patient'), 10);
    const now = shouldShow(minute, n);
    if (!animate || !prev) {
      el.style.transition = 'none';
      el.style.opacity = now ? '1' : '0';
      return;
    }
    const was = shouldShowPrev(minute, n);
    if (was === now) {
      el.style.transition = 'none';
      el.style.opacity = now ? '1' : '0';
      return;
    }
    if (now && !was) {
      // Fade IN: wait until the line has drawn past this dot's x.
      // Start from 0, then delay-in based on how far along the reveal is.
      el.style.transition = 'none';
      el.style.opacity = '0';
      void el.getBoundingClientRect();
      // Rough timing: reveal animates over ~900ms; fade-in near its end.
      setDotState(el, true, { fadeDelay: 700, fadeDur: 300 });
    } else if (!now && was) {
      // Fade OUT first (before the line retracts).
      setDotState(el, false, { fadeDelay: 0, fadeDur: 240 });
    }
  });

  // Noon marker visibility: fade in as the pen reaches noon (T+125), fade
  // out on reverse that pulls the pen back before noon.
  const noonEls = [svg.querySelector('.noon-marker'), svg.querySelector('.noon-label')].filter(Boolean);
  const NOON_MINUTE = 125;
  const showNoon = ph.cutoffMinute >= NOON_MINUTE;
  const wasNoon = prev ? prev.cutoffMinute >= NOON_MINUTE : false;
  noonEls.forEach(el => {
    if (!animate || !prev) {
      el.style.transition = 'none';
      el.style.opacity = showNoon ? '1' : '0';
      return;
    }
    if (showNoon === wasNoon) {
      el.style.transition = 'none';
      el.style.opacity = showNoon ? '1' : '0';
      return;
    }
    if (showNoon && !wasNoon) {
      // Fade in just as the pen reaches noon.
      el.style.transition = 'none';
      el.style.opacity = '0';
      void el.getBoundingClientRect();
      el.style.transition = 'opacity 320ms ease 650ms';
      requestAnimationFrame(() => { el.style.opacity = '1'; });
    } else {
      // Fade out ahead of the line retracting below noon.
      el.style.transition = 'opacity 240ms ease';
      el.style.opacity = '0';
    }
  });
}


function updateStart955(prevPhase, newPhase) {
  const slide = main.querySelector('.s955-slide');
  if (!slide) return false;
  if (prevPhase === newPhase) return true;

  const prev = S955_PHASES[prevPhase];
  const next = S955_PHASES[newPhase];
  if (!prev || !next) return false;

  // --- Determine chart animation mode based on transition shape --- //
  const chartHost = slide.querySelector('.chart-wrap');

  // --- Text helpers --- //
  const fadeSwapText = (el, newText) => {
    if (!el) return;
    if (el.textContent === newText) return;
    el.style.transition = 'opacity 0.2s ease';
    el.style.opacity = '0';
    setTimeout(() => { el.textContent = newText; el.style.opacity = '1'; }, 200);
  };
  const fadeSwapHTML = (el, newHTML) => {
    if (!el) return;
    if (el.innerHTML === newHTML) return;
    el.style.transition = 'opacity 0.22s ease';
    el.style.opacity = '0';
    setTimeout(() => { el.innerHTML = newHTML; el.style.opacity = '1'; }, 220);
  };

  // --- Eyebrow --- //
  let eyebrow = slide.querySelector('.problem-eyebrow');
  if (next.time) {
    if (!eyebrow) {
      eyebrow = document.createElement('div');
      eyebrow.className = 'problem-eyebrow s955-fadein';
      eyebrow.style.cssText = 'color:#1a3a7b;margin-bottom:6px';
      eyebrow.innerHTML = next.time;
      const h = slide.querySelector('.slide-title');
      if (h) h.parentNode.insertBefore(eyebrow, h);
    } else {
      fadeSwapHTML(eyebrow, next.time);
    }
  } else if (eyebrow) {
    eyebrow.style.transition = 'opacity 0.2s ease';
    eyebrow.style.opacity = '0';
    setTimeout(() => eyebrow && eyebrow.remove(), 220);
  }

  // --- Heading --- //
  const heading = slide.querySelector('.slide-title');
  fadeSwapHTML(heading, next.heading);

  // --- Subtitle --- //
  let subEl = slide.querySelector('.slide-sub');
